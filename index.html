<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="City Gridiron: a 3D low-poly football game you play in the browser.">
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>City Gridiron</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a scoreboard header, one scrolling view, a bottom tab bar. The match takes over the whole screen. */
:root{
  color-scheme:dark;
  --bg:#0c1411;--panel:#131e19;--panel2:#1b2a22;--line:#2a3c33;--fg:#e8efe9;--muted:#8fa297;
  --chalk:#f4c430;--ink:#141a12;--good:#4cc47a;--bad:#e5604f;--sel:#2b2812;--stage:#06090b;--glow:#ffffff;--mat:#55705f;--mat2:#6d8a78;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
#app{height:100%;display:flex;flex-direction:column}
#top,#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top{display:flex;align-items:center;gap:12px;padding-block:10px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .who{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
#top h1{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
#top .meta{color:var(--muted);font-size:13px;margin-top:2px}
#top .stat{text-align:right;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
#top .stat small{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sw{display:inline-block;width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--a) 0 56%,var(--b) 56%);box-shadow:0 0 0 1px rgba(255,255,255,.25);flex:none;vertical-align:-4px}
.sw.lg{width:42px;height:42px;border-radius:9px}
#view{flex:1;min-height:0;overflow-y:auto;padding-block:16px}
.wrap{max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
#tabs{display:flex;background:var(--panel);border-top:1px solid var(--line)}
#tabs button{flex:1;min-width:0;background:none;border:0;border-top:3px solid transparent;padding:11px 4px 12px;font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#tabs button.on{color:var(--fg);border-top-color:var(--chalk)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.hero{background:linear-gradient(180deg,var(--panel2),var(--panel))}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk);margin:0 0 8px;font-weight:600}
h2{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.02;margin:0 0 8px;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
h3{font-family:var(--display);font-size:21px;font-weight:600;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}
p{margin:0 0 8px;max-width:68ch}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sp{margin-top:10px}
.btn{background:var(--chalk);color:var(--ink);border:0;border-radius:8px;padding:9px 18px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost.sel{box-shadow:inset 0 0 0 2px var(--chalk)}
.btn.sm{padding:6px 12px;font-size:16px}
.btn:disabled{opacity:.4;cursor:default}
.match{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.tb{display:flex;align-items:center;gap:12px;flex:1;min-width:170px}
.tb b{font-family:var(--display);font-size:27px;text-transform:uppercase;line-height:1;display:block}
.tb span{color:var(--muted);font-size:13px}
.vs{font-family:var(--display);color:var(--muted);font-size:19px;text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;gap:6px;margin-top:5px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-variant-numeric:tabular-nums;color:var(--fg)!important}
.news{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:7px}
.news li{padding-left:12px;border-left:2px solid var(--line)}
.news+.row{margin-top:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.pick button{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:left;min-width:0}
.pick button:hover,.play:hover,.prow:hover{border-color:var(--muted)}
.pick b{display:block;font-family:var(--display);font-size:19px;text-transform:uppercase;line-height:1.05}
.pick small{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 8px;text-align:right}
.tbl td{padding:7px 8px;border-top:1px solid var(--line);text-align:right}
.tbl .l{text-align:left}
.tbl .ovr,.prow .ovr{font-family:var(--display);font-size:19px;font-weight:700}
.tbl tr.st td{background:var(--panel2)}
.tbl tr.me td{background:var(--sel)}
.tbl tr.div td{font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk);border-top:0;padding-top:12px}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px}
.tr-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.plist{display:flex;flex-direction:column;gap:4px;max-height:330px;overflow-y:auto;padding-right:2px}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto auto;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:left;font-variant-numeric:tabular-nums;font-size:14px}
.prow.on{border-color:var(--chalk);background:var(--sel)}
.prow .pos{font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted)}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{flex:1;min-width:120px;max-width:260px;height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bad)}
.meter.ok i{background:var(--good)}
.tr-sum .row{margin-bottom:8px}

#game{position:fixed;inset:0;z-index:50;background:var(--stage);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#bug{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-family:var(--display)}
#bug .tm{display:flex;align-items:center;gap:7px;font-size:24px;font-weight:700;line-height:1}
#bug .tm i{font-style:normal;min-width:1.3em;text-align:center;font-variant-numeric:tabular-nums;color:var(--chalk)}
#bug .mid{flex:1;text-align:center;line-height:1.1;min-width:0}
#bug .mid b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
#bug .mid span{font-size:15px;color:var(--muted);white-space:nowrap;letter-spacing:.03em}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#flash{position:absolute;left:50%;top:14%;transform:translateX(-50%);max-width:94%;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,48px);line-height:1;text-transform:uppercase;letter-spacing:.03em;color:var(--glow);text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px rgba(0,0,0,.55);pointer-events:none;opacity:0;transition:opacity .18s}
#flash.on{opacity:1}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px;max-height:46%;overflow-y:auto;min-height:58px}
#panel .res{font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.plays{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
.play{display:flex;flex-direction:column;gap:1px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px 7px;text-align:left;min-width:0}
.play svg{width:100%;height:46px;display:block}
.play b{font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.play small{color:var(--muted);font-size:12px;line-height:1.2}
.pl-los{stroke:var(--line);stroke-width:.5}
.pl-rt{fill:none;stroke:var(--chalk);stroke-width:.9;stroke-linejoin:round;stroke-linecap:round}
.pl-dot{fill:var(--fg)}
.pl-ol{fill:var(--muted)}
.kbd{display:inline-block;min-width:1.5em;text-align:center;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:0;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-right:6px;opacity:.7;vertical-align:2px;text-transform:none}
.btn .kbd{margin:0 0 0 8px}
.kick{position:relative;height:22px;background:var(--bg);border:1px solid var(--line);border-radius:6px;flex:1;min-width:160px}
.kick .zone{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);background:var(--good);opacity:.6}
.kick .mk{position:absolute;top:-4px;bottom:-4px;left:0;width:4px;margin-left:-2px;background:var(--chalk);border-radius:2px}
.cardp h3{font-size:26px;margin-bottom:6px}
.cardp .row{margin-top:10px}
#panel.live{touch-action:none}
.pad{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px;border:1px dashed var(--line);border-radius:10px;padding:12px}
.tip{display:none;margin:10px 0 0}
@media (max-width:520px){.uni span{font-size:12px;letter-spacing:0}.uni{padding:6px 0 5px}h2{font-size:28px}#bug{gap:6px;padding:6px 8px}#bug .tm{font-size:19px;gap:5px}#bug .mid b{font-size:16px}#bug .mid span{font-size:12px}#bug .btn{padding:4px 8px;font-size:14px}#bug .wide{display:none}#top h1{font-size:23px}}
@media (orientation:portrait){#stage{flex:none;height:min(78vw,58%)}#panel{flex:1;max-height:none}.pad{min-height:140px}.tip{display:block}}
@media (prefers-reduced-motion:reduce){#flash{transition:none}}

input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
#edName{flex:1;min-width:130px;max-width:260px}#edNum{width:76px}
label{color:var(--muted);font-size:13px}
.xf{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;line-height:1;color:var(--ink);background:var(--chalk);border-radius:3px;padding:2px 5px;margin-left:4px;vertical-align:1px}
.edit{border-color:var(--chalk)}.edit .row{margin-bottom:10px}.edit .row:last-child{margin-bottom:0}.edit h3{margin:0}
.tbl tr.pl{cursor:pointer}.tbl tr.pl:hover td{background:var(--panel2)}.tbl tr.cur td{background:var(--sel)}.tbl tr.out td{opacity:.6}
.tbl tr.pl:focus-visible{outline:2px solid var(--chalk);outline-offset:-2px}
.unis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin:10px 0 14px}
.unicol h3{margin-bottom:6px}
.unirow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.uni{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--mat);border:2px solid var(--line);border-radius:8px;padding:8px 2px 6px;min-width:0}
.uni svg{width:44px;height:70px;max-width:100%}
.uni span{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.uni.on{border-color:var(--chalk);background:var(--mat2)}
.set{margin:4px 0 12px}
.prow.pk{border-style:dashed}.prow.pk .pos{color:var(--chalk)}
.poss{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--chalk)}
.dcalls{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sp{margin-top:10px}
@media (max-width:520px){.uni span{font-size:12px;letter-spacing:0}.uni svg{width:36px;height:57px}}

.pbtabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.pbtabs button{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pbtabs button.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.dev{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;border-radius:3px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dev.dF{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}.dev.dE{color:var(--chalk);border-color:var(--chalk)}.dev.dS{color:var(--fg)}
#who{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(8,14,11,.84);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.4;pointer-events:none}
#who b{font-family:var(--display);font-size:19px;letter-spacing:.03em;text-transform:uppercase}
#who span{color:var(--muted)}#who .zl{font-size:13px}#who em.xf{font-style:normal}#who .sw{width:14px;height:14px;border-radius:3px;vertical-align:-2px}
.xf.off{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted)}
.flagchip{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:#ffd400;color:#141a12;border-radius:4px;padding:1px 8px}
.setp{display:inline-flex;align-items:center;gap:6px}
.play small{overflow-wrap:anywhere}
@media (max-width:520px){#who{font-size:12px;padding:4px 8px;left:6px;bottom:6px}#who b{font-size:15px}.pbtabs button{font-size:14px;padding:2px 9px}}
#cap{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:max-content;max-width:min(94%,640px);background:rgba(8,14,11,.82);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;line-height:1.35;pointer-events:none}
#cap b{color:var(--chalk);font-weight:600}
#intro{position:absolute;left:12px;bottom:12px;max-width:min(92%,440px);background:rgba(8,14,11,.86);border:1px solid var(--line);border-left:4px solid var(--chalk);border-radius:8px;padding:10px 14px;pointer-events:none}
#intro h2{font-family:var(--display);font-size:clamp(26px,5vw,42px);line-height:1;margin:2px 0 4px;text-transform:uppercase}
#intro p{margin:3px 0;font-size:13px;line-height:1.35}#intro .sub{color:var(--chalk)}
.vsel{max-width:min(100%,260px)}
.tag.cap{color:#1a1405;background:var(--chalk);border-color:var(--chalk);font-weight:700}
.news li.me,.tr-sum .me,span.me{color:var(--chalk)}
#cap:not([hidden])~#flash{top:calc(14% + 40px)}
@media (max-width:560px){#cap{font-size:11.5px;padding:3px 7px;top:4px}#cap:not([hidden])~#flash{top:calc(10% + 50px);font-size:22px}#intro{left:6px;bottom:6px;padding:6px 10px}#intro p{font-size:12px}#intro p.x{display:none}#intro h2{font-size:24px}}
.tol{display:inline-flex;flex-direction:column;gap:2px}.tol s{display:block;width:9px;height:3px;background:var(--chalk);border-radius:1px}.tol s.off{opacity:.18}
#bug .mid em.pc{font-style:normal;margin-left:8px;padding:0 4px;border-radius:3px;background:rgba(255,255,255,.08);color:var(--muted)}#bug .mid em.pc.low{color:#1a1405;background:var(--chalk)}
#bug .mid em.run{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5fd38a;margin-left:6px;vertical-align:middle;animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
.tag.inj{color:#fff;background:#b3261e;border-color:#b3261e}
.pbtabs+.row.sp{margin-top:6px;margin-bottom:8px}
.drills{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.drill{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--bg);color:var(--chalk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit}
.drill b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}.drill small{color:var(--muted);line-height:1.35}.drill span{font-size:12px;color:var(--good)}.drill.done span{color:var(--muted)}
.drill:hover{border-color:var(--chalk)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:8px 0}.keys div{display:flex;flex-direction:column;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}.keys b{font-family:var(--display);font-size:17px;text-transform:uppercase}
.wxchip{font-size:11px;padding:2px 6px;border-radius:4px;background:rgba(150,190,230,.18);color:#cfe3f7;white-space:nowrap}
.flagchip.rp{background:#c9302c;color:#fff}
.tbl.sm td,.tbl.sm th{padding:3px 8px;font-size:13px}
@media (max-width:560px){.wxchip{display:none}.flagchip.rp{font-size:11px;padding:1px 5px}}
/* Be a Pro */
.posgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.posb{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.posb b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;line-height:1.05}
.posb small{color:var(--muted);font-size:13px;line-height:1.35}
.posb.on{border-color:var(--chalk);box-shadow:inset 0 0 0 1px var(--chalk);background:var(--sel)}
.posb.on b{color:var(--chalk)}
.pform{display:grid;grid-template-columns:2fr 1fr 2fr;gap:10px;margin-bottom:12px}
.pform label{display:flex;flex-direction:column;gap:4px;min-width:0}
.pform label span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pform input,.pform select{width:100%}
.procard .pc-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.procard .pc-top h3{margin:0 0 2px}.procard .pc-top p{margin:0}
.pc-num{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;width:64px;height:64px;border-radius:12px;display:grid;place-items:center;background:var(--bg);border:2px solid var(--chalk);color:var(--chalk);flex:none}
.pc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pc-stats div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.pc-stats b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.pc-stats small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.xpbar{height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-bottom:6px}
.xpbar span{display:block;height:100%;background:var(--chalk)}
.goals li{font-weight:500}
.tbl tr.me td{background:var(--sel)}

const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function gauss(){let u=0;for(let i=0;i<6;i++)u+=Math.random();return (u-3)/0.7071;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function mkPlayer(pos,ovr,age,taken,dev){ovr=clamp(Math.round(ovr),50,99);if(!dev){const r=Math.random();dev=r<0.04?'E':r<0.3?'S':'N';}

const FA_BAG=POS_ORDER.flatMap(pos=>Array(ROSTER_N[pos]).fill(pos));

function newLeague(){NID=1;
  const teams=TEAM_DEFS.map((d,i)=>{const taken=new Set(),roster=[];

      const p={id:NID++,n:r[0],pos:r[1],age:r[5],ovr:r[2],dev:devFor(r[2],r[5],r[4]),pot:r[2],spd:spdFor(r[1],r[2]),num,xf:r[4]===1?XFS[r[1]][NID%3][0]:false,rk:r[5]<=22?2026:0};p.pot=potFor(p);p.leg=Math.round(Math.max(0,r[5]-22)*Math.max(0,r[2]-82)/6*10)/10;roster.push(p);}

// Brings a save from the previous version up to date.
// v6: one of three X-Factors per position instead of a yes/no flag.
function fixXF(o,d){if(!o||typeof o!=='object'||d>6)return;if(Array.isArray(o)){for(const x of o)fixXF(x,d+1);return;}if(o.xf===true&&o.pos&&XFS[o.pos])o.xf=XFS[o.pos][(o.id||0)%3][0];for(const k in o)if(o[k]&&typeof o[k]==='object')fixXF(o[k],d+1);}
function migrate(){if(S.v<4)migrate4();if(S.v<5){S.qlen=S.qlen||4;S.rec=S.rec||{s:{},c:{}};S.hof=S.hof||[];S.hist=S.hist||[];S.gpU=S.gpU||0;
  for(const T of S.teams)for(const p of T.roster)if(p.leg==null)p.leg=Math.round(Math.max(0,p.age-(S.season-2026)-22)*Math.max(0,p.ovr-82)/6*10)/10;S.v=5;}
  if(S.v<6){fixXF(S,0);S.v=6;}}
function migrate4(){if(S.talk==null)S.talk=2;if(!S.pst)S.pst={};if(S.season===2026)for(const T of S.teams)for(const q of T.roster)if(q.rk==null&&q.age<=22)q.rk=2026;if(S.v>=3){S.v=4;return;}
  for(const T of S.teams)for(const p of T.roster)if(!p.dev){p.dev=devFor(p.ovr,p.age,p.xf?1:0);if(p.dev==='N'&&p.pot-p.ovr>=8)p.dev='S';}
  if(S.draft)for(const p of S.draft.pool)if(!p.dev)p.dev=p.pot-p.ovr>=11?'E':p.pot-p.ovr>=6?'S':'N';
  if(!S.fa)S.fa=genFA(60);if(S.speed==null)S.speed=1;if(S.koRet==null)S.koRet=true;if(!S.rank){S.rank={};computeRanks(false);}S.v=4;}

// ===== depth chart and ratings =====
function starters(T,pos){return T.roster.filter(p=>p.pos===pos).sort((a,b)=>(a.inj?1:0)-(b.inj?1:0)||(b.pro?1:0)-(a.pro?1:0)||b.ovr-a.ovr).slice(0,START_N[pos]);}
// A starter on a simulated team gets hurt for a few weeks.
function simInjury(T){const c=T.roster.filter(p=>p.pos!=='K'&&p.pos!=='P'&&!p.inj&&!p.pro&&isStarter(T,p));if(!c.length)return;const p=pick(c),wk=pick([1,1,1,2,2,3,4,6]);p.inj=wk;
  if(T.id===S.user)S.news.unshift('Injury: '+p.n+' ('+p.pos+') is out '+wk+(wk===1?' week.':' weeks.'));}
function isStarter(T,p){return starters(T,p.pos).includes(p);}
function ratings(T){const avg=pos=>{const a=starters(T,pos);return a.reduce((x,p)=>x+p.ovr+(p.xf?2:0)+(p.cap?1:0),0)/(a.length||1);};
  const off=(avg('QB')*3+avg('RB')+avg('WR')*2.5+avg('TE')*0.7+avg('OL')*2.8)/10;
  const def=(avg('DL')*3+avg('LB')*2.2+avg('CB')*2.6+avg('S')*2.2)/10;
  return {off:Math.round(off),def:Math.round(def),ovr:Math.round((off+def)/2)};}
function checkXF(T,p){if(!p.xf&&!p.pro&&p.ovr>=XF_OVR){p.xf=xfRand(p.pos);if(T.id===S.user)S.news.unshift(p.n+' ('+p.pos+') earned an X-Factor: '+xfName(p)+'.');}}

// ===== schedule: 17 games in 18 weeks. Each division rival twice, one bye per team. =====
const cmpTeams=(a,b)=>(b.w/((b.w+b.l)||1))-(a.w/((a.w+a.l)||1))||(b.pf-b.pa)-(a.pf-a.pa)||a.id-b.id;
function computeRanks(byRecord){for(const c of ['A','N'])for(const d of DIVS){const ts=S.teams.filter(t=>t.conf===c&&t.div===d);
  if(byRecord)ts.sort(cmpTeams);else ts.sort((a,b)=>ratings(b).ovr-ratings(a).ovr||a.id-b.id);ts.forEach((t,i)=>{S.rank[t.id]=i;});}}
function byeMatch(win,cap){const used=new Array(32).fill(false),cnt=win.map(()=>0),res=[];let iters=0;
  const opts=t=>{const o=[];win.forEach((r,ri)=>{if(cnt[ri]>=cap)return;const gme=r.g.find(x=>x.h===t||x.a===t);if(gme&&!used[gme.h]&&!used[gme.a])o.push([ri,gme]);});return o;};
  function rec(){if(++iters>2500)return false;let bo=null;for(let t=0;t<32;t++){if(used[t])continue;const o=opts(t);if(!o.length)return false;if(!bo||o.length<bo.length)bo=o;}
    if(!bo)return true;shuffle(bo);for(const [ri,gme] of bo){used[gme.h]=used[gme.a]=true;cnt[ri]++;res.push([ri,gme]);if(rec())return true;res.pop();cnt[ri]--;used[gme.h]=used[gme.a]=false;}return false;}
  return rec()?res:null;}
function makeSchedule(yr){const D={};for(const c of ['A','N'])DIVS.forEach((d,i)=>{D[c+i]=S.teams.filter(t=>t.conf===c&&t.div===d).sort((a,b)=>S.rank[a.id]-S.rank[b.id]).map(t=>t.id);});
  const g=(h,a)=>({h,a,hs:null,as:null}),R=[],RR=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]],IP=RR[yr%3];
  // division rivals, home and away
  for(let leg=0;leg<2;leg++)for(const r of RR){const wk=[];for(const k in D){const T=D[k];for(const [i,j] of r)wk.push(leg?g(T[j],T[i]):g(T[i],T[j]));}R.push({div:1,g:wk});}
  // every team of one other division in the same conference
  for(let r=0;r<4;r++){const wk=[];for(const c of ['A','N'])for(const [x,y] of IP)for(let i=0;i<4;i++){const a=D[c+x][i],b=D[c+y][(i+r)%4];wk.push(((i%2)^(r<2?0:1))?g(a,b):g(b,a));}R.push({g:wk});}
  // every team of one division in the other conference
  for(let r=0;r<4;r++){const wk=[];for(let i=0;i<4;i++)for(let k=0;k<4;k++){const a=D['A'+i][k],b=D['N'+(i+yr)%4][(k+r)%4];wk.push(((k%2)^(r<2?0:1))?g(a,b):g(b,a));}R.push({g:wk});}
  // the teams that finished in the same place in the two remaining divisions of the conference
  for(let r=0;r<2;r++){const wk=[];for(const c of ['A','N'])for(let k=0;k<4;k++){const X=D[c+IP[0][0]][k],Y=D[c+IP[0][1]][k],Z=D[c+IP[1][0]][k],W=D[c+IP[1][1]][k];if(r===0)wk.push(g(X,Z),g(Y,W));else wk.push(g(W,X),g(Z,Y));}R.push({g:wk});}
  // a 17th game against a same-place team from the other conference
  {const wk=[];for(let i=0;i<4;i++)for(let k=0;k<4;k++){const a=D['A'+i][k],b=D['N'+(i+yr+2)%4][k];wk.push(yr%2?g(a,b):g(b,a));}R.push({g:wk});}
  const div=shuffle(R.filter(r=>r.div)),last=div.pop(),order=shuffle(div.concat(R.filter(r=>!r.div))).concat([last]);
  // byes: pull team-disjoint games out of weeks 5-13 and play them together in a makeup week
  const win=order.slice(4,13),M=byeMatch(win,3)||byeMatch(win,4)||byeMatch(win,6)||byeMatch(win,16);
  for(const [ri,gme] of M)win[ri].g.splice(win[ri].g.indexOf(gme),1);
  return [...order.slice(0,13),{g:M.map(x=>x[1])},...order.slice(13)].map(r=>r.g);}
function simGame(H,A){const rh=ratings(H),ra=ratings(A);
  const f=(o,d,hf)=>{const x=Math.max(0,21+(o-d)*0.6+hf+gauss()*8);const td=Math.floor(x/7);return td*7+Math.min(2,Math.round((x-td*7)/3))*3;};
  let hs=f(rh.off,ra.def,1.5),as=f(ra.off,rh.def,0);if(hs===as){if(Math.random()<0.5)hs+=3;else as+=3;}return [hs,as];}
function currentGames(){if(S.phase==='regular')return S.schedule[S.week]||[];if(S.phase==='playoffs')return S.po.games;return [];}
function userMatch(){return currentGames().find(g=>(g.h===S.user||g.a===S.user)&&g.hs==null)||null;}
function roundName(){if(!S.po)return '';const n=S.po.alive.A.length+S.po.alive.N.length;return n>=14?'Wild Card round':n>=8?'Divisional round':n>=4?'Conference finals':'Gridiron Bowl';}
// Playoff field: four division winners seeded 1-4 by record, then three wild cards seeded 5-7.
function seedsFor(c){const ts=S.teams.filter(t=>t.conf===c);const dw=DIVS.map(d=>ts.filter(t=>t.div===d).sort(cmpTeams)[0]).sort(cmpTeams);
  const rest=ts.filter(t=>!dw.includes(t)).sort(cmpTeams);return {div:dw,wc:rest.slice(0,3),hunt:rest.slice(3,6)};}
function startPlayoffs(){S.phase='playoffs';S.offer=null;const seeds={};computeRanks(true);
  for(const c of ['A','N']){const s=seedsFor(c);seeds[c]=[...s.div,...s.wc].map(t=>t.id);}
  S.po={seeds,alive:{A:seeds.A.slice(),N:seeds.N.slice()},games:[],log:[]};
  const U=S.teams[S.user],seed=seeds[U.conf].indexOf(S.user);
  S.news.unshift(seed>=0?'You made the playoffs as the '+CONF[U.conf]+' No. '+(seed+1)+' seed'+(seed<4?' (division winner).':' (wild card).'):'You missed the playoffs at '+U.w+'-'+U.l+'.');
  buildRound();}
function buildRound(){const po=S.po;po.games=[];const A=po.alive.A,N=po.alive.N;
  if(A.length===1&&N.length===1){po.games.push({h:A[0],a:N[0],hs:null,as:null,conf:'F'});return;}
  for(const c of ['A','N']){const L=po.alive[c],pool=L.length===7?L.slice(1):L.slice();
    for(let i=0;i<pool.length/2;i++)po.games.push({h:pool[i],a:pool[pool.length-1-i],hs:null,as:null,conf:c});}}
function finishRound(){const po=S.po,losers=po.games.map(g=>g.hs>g.as?g.a:g.h);
  po.log.push({name:roundName(),games:po.games.map(g=>({h:g.h,a:g.a,hs:g.hs,as:g.as}))});
  const fin=po.games.length===1&&po.games[0].conf==='F',g0=po.games[0];
  for(const c of ['A','N'])po.alive[c]=po.alive[c].filter(id=>!losers.includes(id));
  if(fin){S.champ=g0.hs>g0.as?g0.h:g0.a;S.phase='offseason';po.games=[];recordSeason();computeAwards();S.hist=S.hist||[];S.hist.unshift({y:S.season,champ:S.champ,ru:g0.hs>g0.as?g0.a:g0.h,sc:Math.max(g0.hs,g0.as)+'-'+Math.min(g0.hs,g0.as),mvp:S.awards&&S.awards.list[0]?S.awards.list[0].n+' ('+S.teams[S.awards.list[0].team].abbr+')':''});S.news.unshift(S.teams[S.champ].name+' win the '+S.season+' Gridiron Bowl.');}
  else buildRound();}
function completeStep(played){const games=currentGames(),reg=S.phase==='regular';
  for(const g of games)if(g.hs==null){const r=simGame(S.teams[g.h],S.teams[g.a]);g.hs=r[0];g.as=r[1];}
  for(const T of S.teams)for(const p of T.roster)if(p.inj){p.inj--;if(!p.inj){delete p.inj;if(T.id===S.user)S.news.unshift(p.n+' ('+p.pos+') is healthy again.');}}
  for(const g of games)for(const id of [g.h,g.a])if(!(id===S.user&&played)&&Math.random()<0.28)simInjury(S.teams[id]);
  const ug=games.find(g=>g.h===S.user||g.a===S.user);
  if(ug){const home=ug.h===S.user,us=home?ug.hs:ug.as,th=home?ug.as:ug.hs,opp=S.teams[home?ug.a:ug.h],won=us>th;
    const tp=(played?(won?5:3):(won?2:1))+(reg?0:2);if(S.mode!=='pro')S.tp+=tp;
    S.last=(reg?'Week '+(S.week+1):roundName())+': '+(won?'Won ':'Lost ')+us+'-'+th+(home?' vs ':' at ')+opp.name+(S.mode==='pro'?'':' (+'+tp+' training points)');S.news.unshift(S.last);}
  else if(reg)S.news.unshift('Week '+(S.week+1)+': bye week.');
  if(reg){
    for(const g of games){const H=S.teams[g.h],A=S.teams[g.a];H.pf+=g.hs;H.pa+=g.as;A.pf+=g.as;A.pa+=g.hs;if(g.hs>g.as){H.w++;A.l++;}else{A.w++;H.l++;}}
    S.week++;if(Math.random()<0.35)aiSignings(1,pick(S.teams));
    if(S.week>=S.schedule.length)startPlayoffs();else if(S.week<TRADE_DEADLINE)makeOffer();else{if(S.week===TRADE_DEADLINE)S.news.unshift('The trade deadline has passed. Trades reopen in the offseason.');S.offer=null;}}
  else finishRound();
  if(S.news.length>16)S.news.length=16;save();}
function finishUserGame(us,them){if(S.phase==='regular')S.gpU=(S.gpU||0)+1;const m=userMatch();if(m){const home=m.h===S.user;m.hs=home?us:them;m.as=home?them:us;}completeStep(true);}

// ===== end-of-season awards =====
function statLine(p,T){const o=Math.max(0,p.ovr-68),w=T.w,r=Math.round,f=x=>r(x).toLocaleString('en-US'),s=p.ss;
  if(s){if(p.pos==='QB')return f(s.py||0)+' yards, '+(s.ptd||0)+' touchdowns';if(p.pos==='RB')return f(s.ry||0)+' rushing yards, '+(s.td||0)+' touchdowns';if(p.pos==='WR'||p.pos==='TE')return (s.rec||0)+' catches, '+f(s.recy||0)+' yards'+(s.td?', '+s.td+' touchdowns':'');
    if(p.pos==='DL')return (s.sk||0)+' sacks, '+(s.tk||0)+' tackles';if(p.pos==='LB')return (s.tk||0)+' tackles, '+(s.sk||0)+' sacks';if(p.pos==='CB'||p.pos==='S')return (s.int||0)+' interceptions, '+(s.pd||0)+' passes defended';if(p.pos==='K')return (s.fgm||0)+' of '+(s.fga||0)+' field goals';}
  if(p.pos==='QB')return f(2700+o*58+w*40)+' yards, '+r(13+o*0.85+w*0.55)+' touchdowns';
  if(p.pos==='RB')return f(620+o*36+w*12)+' rushing yards, '+r(3+o*0.42)+' touchdowns';
  if(p.pos==='WR')return r(50+o*2.1)+' catches, '+f(560+o*37)+' yards, '+r(2+o*0.4)+' touchdowns';
  if(p.pos==='TE')return r(38+o*2)+' catches, '+f(380+o*30)+' yards';
  if(p.pos==='DL')return (3+o*0.52).toFixed(1)+' sacks, '+r(28+o*1.3)+' tackles';
  if(p.pos==='LB')return r(78+o*2.6)+' tackles, '+(1+o*0.18).toFixed(1)+' sacks';
  if(p.pos==='CB'||p.pos==='S')return r(1+o*0.2)+' interceptions, '+r(6+o*0.45)+' passes defended';
  if(p.pos==='K')return r(80+o*0.6)+'% on field goals';return 'anchored the line';}
function computeAwards(){const yr=S.season,all=[],rooks=[];
  for(const T of S.teams)for(const p of T.roster){const x={p,T,v:p.ovr+T.w*0.8+(p.xf?2:0)+rnd(-2,2)+(p.pro?proBonus():0)};if(isStarter(T,p))all.push(x);if(p.rk===yr)rooks.push(x);}
  const top=(arr,f,adj)=>arr.filter(f).map(x=>({p:x.p,T:x.T,s:x.v+(adj?adj(x):0)})).sort((a,b)=>b.s-a.s)[0];
  const off=x=>['QB','RB','WR','TE'].includes(x.p.pos),def=x=>['DL','LB','CB','S'].includes(x.p.pos);
  const mvp=top(all,off,x=>x.p.pos==='QB'?5+x.T.w*0.5:0);
  const pairs=[['Most Valuable Player','MVP',mvp],['Offensive Player of the Year','Offensive Player of the Year',top(all,x=>off(x)&&x.p.pos!=='QB'&&x.p!==mvp.p)],['Defensive Player of the Year','Defensive Player of the Year',top(all,def)],
    ['Offensive Rookie of the Year','Offensive Rookie of the Year',top(rooks,off)],['Defensive Rookie of the Year','Defensive Rookie of the Year',top(rooks,def)]];
  const list=[];for(const [t,short,w] of pairs){if(!w)continue;const p=w.p;list.push({t,n:p.n,pos:p.pos,team:w.T.id,line:statLine(p,w.T)});p.aw=(p.aw||[]).concat(yr+' '+short);
    if(w.T.id===S.user){if(S.mode==='pro'){if(p.pro)S.news.unshift('You won '+t+'!');}else{S.tp+=5;S.news.unshift(p.n+' won '+t+'! (+5 training points)');}}}
  const pro=[];for(const [pos,n] of [['QB',1],['RB',1],['WR',2],['TE',1],['OL',2],['DL',2],['LB',2],['CB',2],['S',1],['K',1]]){
    for(const x of all.filter(y=>y.p.pos===pos).sort((a,b)=>b.v-a.v).slice(0,n)){pro.push({pos,n:x.p.n,team:x.T.id});x.p.aw=(x.p.aw||[]).concat(yr+' All-Pro');if(x.T.id===S.user){if(S.mode==='pro'){if(x.p.pro)S.news.unshift('You were named All-Pro.');}else{S.tp+=2;S.news.unshift(x.p.n+' was named All-Pro. (+2 training points)');}}}}
  S.awards={yr,list,pro};}
// ===== weather for a home game: roof, season week and city decide it =====
const COLD=['BUF','NE','NYJ','NYG','CLE','PIT','CIN','BAL','CHI','GB','DEN','KC','PHI','WAS'],WINDY=['BUF','CHI','CLE','NE','NYJ','NYG','GB'];
function gameWeather(H){const st=H.stad||STAD[H.abbr]||['O'],late=S.phase==='playoffs'||S.week>=11,night=Math.random()<(S.phase==='playoffs'?0.45:0.3);
  if(st[0]==='D'||st[0]==='T')return {sky:'clear',wind:0,wdir:1,night,indoor:true};
  let sky='clear';const r=Math.random();
  if(COLD.includes(H.abbr)&&r<(late?0.3:S.week>=8?0.08:0))sky='snow';
  else if(Math.random()<(H.abbr==='SEA'?0.32:H.abbr==='MIA'||H.abbr==='TB'||H.abbr==='JAX'?0.16:0.11))sky='rain';
  const wind=Math.round(rint(0,9)+(WINDY.includes(H.abbr)?rint(0,10):0)+(sky!=='clear'?rint(0,5):0));
  return {sky,wind,wdir:Math.random()<0.5?-1:1,night,indoor:false};}
function weatherWords(w){if(w.indoor)return 'Indoors, so the weather won\'t matter';const s=w.sky==='snow'?'Snow is coming down':w.sky==='rain'?'It\'s raining':w.night?'A clear night':'Clear skies';return s+(w.wind>=12?', and the wind is gusting at '+w.wind+' miles an hour':w.wind>=6?', with a '+w.wind+' mile-an-hour wind':'');}
// ===== season stats, records and the Hall of Fame =====
const r1=x=>Math.round(x*10)/10,nn=x=>Math.max(0,Math.round(x));
// Season numbers for players in simulated games, scaled by rating, team record and role.
function modelStats(p,T,share){const o=Math.max(0,p.ovr-68),w=T.w,f=share*(isStarter(T,p)?1:0.12),g=()=>gauss();let s={};
  if(p.pos==='QB'){const att=520+o*3+g()*25;s={att:att,cmp:att*clamp(0.6+o*0.004+g()*0.015,0.5,0.75),py:2700+o*58+w*40+g()*250,ptd:13+o*0.85+w*0.55+g()*3,pint:clamp(15-o*0.3+g()*2.5,2,25),car:40+Math.random()*30,ry:150+o*4+g()*60};}
  else if(p.pos==='RB')s={car:180+o*6+g()*20,ry:620+o*36+w*12+g()*120,td:3+o*0.42+g()*2,rec:25+o*0.8,recy:200+o*7};
  else if(p.pos==='WR')s={rec:50+o*2.1+g()*8,recy:560+o*37+g()*120,td:2+o*0.4+g()*2};
  else if(p.pos==='TE')s={rec:38+o*2+g()*6,recy:380+o*30+g()*90,td:2+o*0.3+g()*1.5};
  else if(p.pos==='DL')s={tk:28+o*1.3+g()*5,sk:2+o*0.4+g()*1.5};
  else if(p.pos==='LB')s={tk:78+o*2.6+g()*10,sk:1+o*0.18+g(),int:clamp(o*0.08+g()*0.8,0,6)};
  else if(p.pos==='CB'||p.pos==='S')s={tk:45+o+g()*8,int:clamp(1+o*0.2+g()*1.2,0,12),pd:6+o*0.45+g()*2};
  else if(p.pos==='K'){const a=28+g()*4;s={fga:a,fgm:a*clamp(0.8+o*0.006+g()*0.03,0.6,0.98)};}
  const out={};for(const k in s){const v=s[k]*(p.pos==='K'?share:f);out[k]=k==='sk'?Math.max(0,r1(v)):nn(v);}return out;}
const STATK=['att','cmp','py','ptd','pint','car','ry','td','rec','recy','tk','sk','int','pd','fga','fgm','fum','fr'];
function seasonStats(T,p){const real=T.id===S.user?S.pst[p.id]:null,played=T.id===S.user?(S.gpU||0):0,share=clamp((17-played)/17,0,1),m=modelStats(p,T,share),out={};
  for(const k of STATK){const v=(m[k]||0)+(real&&real[k]?real[k]:0)+(k==='td'&&real?(real.ptd?0:0):0);if(v)out[k]=k==='sk'?r1(v):Math.round(v);}
  if(p.pos==='QB'&&real){out.td=out.td||0;}return out;}
const REC_KEYS=[['py','Passing yards','QB'],['ptd','Passing touchdowns','QB'],['ry','Rushing yards','RB'],['recy','Receiving yards',''],['rec','Catches',''],['sk','Sacks',''],['int','Interceptions',''],['tk','Tackles','']];
function careerOf(p){const c={};for(const h of p.hist||[])for(const k in h.s)c[k]=(c[k]||0)+h.s[k];if(c.sk)c.sk=r1(c.sk);return c;}
// Writes every player's season into his history and updates league records.
function recordSeason(){const yr=S.season;S.rec=S.rec||{s:{},c:{}};S.rec.s=S.rec.s||{};S.rec.c=S.rec.c||{};
  for(const T of S.teams)for(const p of T.roster){const s=seasonStats(T,p);p.ss=s;p.hist=(p.hist||[]).concat({y:yr,t:T.abbr,o:p.ovr,s}).slice(-20);
    for(const [k] of REC_KEYS){const v=s[k]||0,cur=S.rec.s[k];if(v>0&&(!cur||v>cur.v))S.rec.s[k]={v,n:p.n,pos:p.pos,t:T.abbr,y:yr};
      const cv=careerOf(p)[k]||0,cc=S.rec.c[k];if(cv>0&&(!cc||cv>cc.v))S.rec.c[k]={v:cv,n:p.n,pos:p.pos,t:T.abbr,y:yr};}}}
function careerLine(p){const c=careerOf(p),f=x=>Math.round(x).toLocaleString('en-US'),n=(p.hist||[]).length;let s;
  if(p.pos==='QB')s=f(c.py||0)+' passing yards, '+(c.ptd||0)+' touchdowns';else if(p.pos==='RB')s=f(c.ry||0)+' rushing yards, '+(c.td||0)+' touchdowns';
  else if(p.pos==='WR'||p.pos==='TE')s=(c.rec||0)+' catches, '+f(c.recy||0)+' yards';else if(p.pos==='DL')s=(c.sk||0)+' sacks';else if(p.pos==='LB')s=f(c.tk||0)+' tackles, '+(c.sk||0)+' sacks';
  else if(p.pos==='CB'||p.pos==='S')s=(c.int||0)+' interceptions';else if(p.pos==='K')s=(c.fgm||0)+' field goals';else s='anchored the line';
  return s+(n?' in '+n+(n===1?' season':' seasons')+' tracked':'');}
function hofScore(p){let sc=p.leg||0;for(const a of p.aw||[]){if(/MVP/.test(a))sc+=4;else if(/Player of the Year/.test(a))sc+=3;else if(/Rookie/.test(a))sc+=1;else if(/All-Pro/.test(a))sc+=0.75;}
  const c=careerOf(p),n=(p.hist||[]).length,pk=Math.max(p.ovr,...(p.hist||[]).map(h=>h.o));
  if(p.pos==='QB'){if((c.py||0)>=45000)sc+=3;if((c.ptd||0)>=320)sc+=2;}else if(p.pos==='RB'){if((c.ry||0)>=10000)sc+=3;}else if(p.pos==='WR'){if((c.recy||0)>=11000)sc+=3;}
  else if(p.pos==='TE'){if((c.recy||0)>=8000)sc+=3;}else if(p.pos==='DL'){if((c.sk||0)>=110)sc+=3;}else if(p.pos==='LB'){if((c.tk||0)>=1300)sc+=2;}else if(p.pos==='CB'||p.pos==='S'){if((c.int||0)>=50)sc+=3;}
  const big={QB:['py',60000],RB:['ry',14000],WR:['recy',15000],TE:['recy',11000],DL:['sk',150],LB:['tk',1800],CB:['int',70],S:['int',70]}[p.pos];if(big&&(c[big[0]]||0)>=big[1])sc+=3;
  if(S.rec&&S.rec.c&&Object.values(S.rec.c).some(r=>r&&r.n===p.n&&r.pos===p.pos))sc+=4;
  if(n>=10)sc+=1;if(n>=15)sc+=1;if(pk>=93)sc+=2;return sc;}
function retireCheck(T,p){S.hof=S.hof||[];if(hofScore(p)<12)return;const yrs=(p.hist||[]).map(h=>h.y),teams=[...new Set((p.hist||[]).map(h=>h.t).concat(T.abbr))];
  S.hof.unshift({n:p.n,pos:p.pos,y:S.season+1,yrs:yrs.length?Math.min(...yrs)+'–'+Math.max(...yrs):'',teams,line:careerLine(p),aw:(p.aw||[]).length,user:T.id===S.user});
  S.news.unshift(p.n+' ('+p.pos+') retired and goes into the Hall of Fame.');}
// ===== practice drills: each one pays training points once per week =====
const drillKey=()=>S.season+'-'+S.phase+'-'+S.week;
function drillDone(kind){return !!(S.drill&&S.drill.key===drillKey()&&S.drill.done[kind]);}
function drillReward(kind,tp){if(drillDone(kind))return 0;if(!S.drill||S.drill.key!==drillKey())S.drill={key:drillKey(),done:{}};S.drill.done[kind]=true;S.tp+=tp;save();return tp;}
// ===== captains and the kick returner =====
function toggleCaptain(p){const U=S.teams[S.user];if(p.cap){p.cap=false;save();return '';}if(U.roster.filter(x=>x.cap).length>=4)return 'You already have 4 captains. Remove one first.';p.cap=true;save();return '';}
function setReturner(p){for(const x of S.teams[S.user].roster)x.kr=false;p.kr=true;save();}

// ===== free agents =====
const signCost=p=>p.ovr<68?1:p.ovr<74?2:p.ovr<79?4:p.ovr<84?7:p.ovr<89?11:16;
function toFA(p){p.num=0;p.cap=p.kr=false;S.fa.push(p);}
function trimFA(){S.fa.sort((a,b)=>b.ovr-a.ovr);if(S.fa.length>90)S.fa.length=90;}
function signFA(p){const U=S.teams[S.user],c=signCost(p);if(U.roster.length>=ROSTER_MAX)return 'Your roster is full at '+ROSTER_MAX+'. Release someone first.';if(S.tp<c)return 'Not enough training points.';
  S.tp-=c;S.fa.splice(S.fa.indexOf(p),1);p.num=numFor(p.pos,new Set(U.roster.map(x=>x.num)));U.roster.push(p);S.news.unshift('Signed free agent '+p.pos+' '+p.n+' ('+p.ovr+' overall).');save();return '';}
// Other teams sign a free agent when he would start for them.
function aiSignings(maxPer,only){for(const T of only?[only]:S.teams){if(T.id===S.user&&S.mode!=='pro')continue;let n=0;
    for(const pos of shuffle(POS_ORDER.slice())){if(n>=maxPer||T.roster.length>=ROSTER_MAX)break;const best=S.fa.filter(p=>p.pos===pos).sort((a,b)=>b.ovr-a.ovr)[0];
      if(best&&best.ovr>=lowestStarter(T,pos,[])+3){S.fa.splice(S.fa.indexOf(best),1);best.num=numFor(pos,new Set(T.roster.map(x=>x.num)));T.roster.push(best);n++;}}
    trimRoster(T,36);}}

// ===== offseason: aging, draft, new season =====
function agePlayer(p){p.age++;const d=p.dev,a=p.age;let c;
  if(a<=25)c=rint(DEV_GROW[d]-1,DEV_GROW[d]+1);else if(a<=29)c=d==='F'?rint(0,3):d==='E'?rint(0,2):d==='S'?rint(-1,2):rint(-1,1);
  else if(a<=32)c=d==='F'?rint(-2,1):d==='E'?rint(-2,0):rint(-3,0);else c=d==='F'||d==='E'?rint(-4,0):rint(-5,-1);
  p.ovr=clamp(p.ovr+c,50,99);p.pot=a<=25?Math.max(p.pot,p.ovr):p.ovr;if(a>=30)p.spd=Math.max(40,p.spd-1);
  return (a>=36&&Math.random()<0.6)||(a>=32&&p.ovr<68)||a>=40||(p.pos!=='K'&&p.pos!=='QB'&&a>=34&&Math.random()<0.5);}
function draftOrder(){const rank=S.teams.slice().sort(cmpTeams).reverse().map(t=>t.id);if(S.champ!=null){rank.splice(rank.indexOf(S.champ),1);rank.push(S.champ);}
  return S.picks.filter(k=>k.yr===S.season+1).sort((a,b)=>a.rd-b.rd||rank.indexOf(a.orig)-rank.indexOf(b.orig)).map(k=>k.id);}
function startDraft(){S.offer=null;
  for(const T of S.teams){const keep=[];
    for(const p of T.roster){if(agePlayer(p)&&!p.pro){if(T.id===S.user)S.news.unshift(p.n+' ('+p.pos+', '+p.ovr+') retired.');retireCheck(T,p);}else{checkXF(T,p);keep.push(p);}}
    T.roster=keep;
    // some veterans hit the open market
    if(T.id!==S.user&&Math.random()<0.45){const c=T.roster.filter(p=>p.age>=28&&p.ovr>=70&&!(p.pos==='QB'&&isStarter(T,p))&&T.roster.filter(x=>x.pos===p.pos).length>START_N[p.pos]);if(c.length){const p=pick(c);T.roster.splice(T.roster.indexOf(p),1);toFA(p);}}}
  S.fa=S.fa.filter(p=>!agePlayer(p)&&p.ovr>=58);
  const n=32*ROUNDS+34,pool=[];for(let i=0;i<n;i++){const pos=pick(FA_BAG);if(pos==='K'&&Math.random()<0.6){i--;continue;}
    const r=Math.random(),dev=i<8?(r<0.25?'F':r<0.65?'E':'S'):i<32?(r<0.05?'F':r<0.3?'E':r<0.75?'S':'N'):(r<0.05?'E':r<0.35?'S':'N');
    const np=mkPlayer(pos,clamp(79-i*0.15+gauss()*2.4,56,84),rint(21,23),null,dev);np.rk=S.season+1;pool.push(np);}
  pool.sort((a,b)=>b.ovr-a.ovr);S.myPicks=[];
  S.draft={yr:S.season+1,order:draftOrder(),i:0,pool,log:[]};S.phase='draft';if(!S.draft.order.length)endDraft();save();}
const curPick=()=>S.draft?S.picks.find(k=>k.id===S.draft.order[S.draft.i]):null;
function aiPick(T){let best=null,bs=-1e9;
  for(const p of S.draft.pool){const have=T.roster.filter(x=>x.pos===p.pos),top=have.reduce((m,x)=>Math.max(m,x.ovr),0);
    let sc=p.ovr+(p.pot-p.ovr)*0.35+(have.length<ROSTER_N[p.pos]?4:0)+(p.ovr>top-3?2:0)+rnd(-1.5,1.5);
    if(p.pos==='QB'&&top>=80)sc-=6;if(p.pos==='K')sc-=have.length?8:2;if(sc>bs){bs=sc;best=p;}}
  return best;}
function makePick(p){const D=S.draft,pk=curPick(),T=S.teams[pk.own];D.pool.splice(D.pool.indexOf(p),1);
  p.num=numFor(p.pos,new Set(T.roster.map(x=>x.num)));T.roster.push(p);
  D.log.unshift({rd:pk.rd,no:D.i+1,team:T.id,n:p.n,pos:p.pos,ovr:p.ovr});
  if(T.id===S.user){S.myPicks.push('Round '+pk.rd+': '+p.pos+' '+p.n+' ('+p.ovr+' overall, '+DEV[p.dev]+')');}
  D.i++;if(D.i>=D.order.length)endDraft();else save();}
function simDraftToUser(){while(S.phase==='draft'&&curPick().own!==S.user)makePick(aiPick(S.teams[curPick().own]));}
function trimRoster(T,max){while(T.roster.length>max){let worst=null;
    for(const p of T.roster){if(p.pro)continue;const c=T.roster.filter(x=>x.pos===p.pos).length;if(c<=ROSTER_N[p.pos])continue;if(!worst||p.ovr<worst.ovr)worst=p;}
    if(!worst)break;T.roster.splice(T.roster.indexOf(worst),1);toFA(worst);}}
function endDraft(){const yr=S.draft.yr;
  for(const p of S.draft.pool.slice(0,30))toFA(p);   // undrafted rookies become free agents
  for(const T of S.teams){const taken=new Set(T.roster.map(p=>p.num));
    for(const pos of POS_ORDER)while(T.roster.filter(p=>p.pos===pos).length<ROSTER_N[pos]){const r=mkPlayer(pos,rnd(58,66),rint(21,23),taken);r.rk=yr;T.roster.push(r);
      if(T.id===S.user)S.news.unshift('Signed undrafted rookie '+r.pos+' '+r.n+' ('+r.ovr+') to fill a roster spot.');}
    if(T.id!==S.user||S.mode==='pro')trimRoster(T,36);}
  trimFA();
  // picks always run two drafts ahead
  S.picks=S.picks.filter(k=>k.yr!==yr).concat(mkPicks(yr+2));
  if(S.myPicks.length)S.news.unshift('Your '+yr+' draft class: '+S.myPicks.join('; ')+'.');
  S.draft=null;S.phase='preseason';save();}
function newSeason(){const U=S.teams[S.user];if(U.roster.length>ROSTER_MAX)return false;for(const T of S.teams)for(const p of T.roster)delete p.inj;
  if(S.po)computeRanks(true);
  aiSignings(2);trimFA();   // the user gets first look at free agents during the preseason
  for(const T of S.teams){T.w=T.l=T.pf=T.pa=0;}
  S.season++;S.week=0;S.phase='regular';S.po=null;S.pst={};S.gpU=0;for(const T of S.teams)for(const p of T.roster)delete p.ss;S.schedule=makeSchedule(S.season);S.offer=null;S.champ=null;S.last='';save();return true;}

// ===== player management =====
function upgradeCost(p){if(p.ovr>=99)return 0;const b=p.ovr<75?1:p.ovr<85?2:p.ovr<92?3:4;return Math.max(1,b-(p.dev==='F'?1:0)-((p.dev==='F'||p.dev==='E')&&b>=3?1:0));}
function upgradePlayer(p){const c=upgradeCost(p);if(!c)return 'Already maxed out.';if(S.tp<c)return 'Not enough training points. Win games to earn more.';
  S.tp-=c;p.ovr++;if(p.pot<p.ovr)p.pot=p.ovr;if(p.ovr%3===0&&p.spd<99)p.spd++;checkXF(S.teams[S.user],p);save();return '';}
function releasePlayer(p){const U=S.teams[S.user];if(U.roster.filter(x=>x.pos===p.pos).length<=START_N[p.pos])return 'You need at least '+START_N[p.pos]+' at '+p.pos+'.';
  U.roster.splice(U.roster.indexOf(p),1);toFA(p);S.news.unshift('Released '+p.pos+' '+p.n+'. He is now a free agent.');save();return '';}
function editPlayer(p,name,num){const U=S.teams[S.user];name=String(name).replace(/[<>]/g,'').trim().slice(0,22);num=Math.round(+num);
  if(!name)return 'Enter a name.';if(!(num>=0&&num<=99))return 'Pick a number from 0 to 99.';
  const clash=U.roster.find(x=>x!==p&&x.num===num);if(clash)return 'No. '+num+' is worn by '+clash.n+'.';
  p.n=name;p.num=num;save();return '';}

// ===== trades: players and draft picks =====
function tradeValue(p){const v=Math.pow(Math.max(0,p.ovr-52)/10,2.5)*POS_VAL[p.pos];const a=p.age;
  let m=a<=23?1.2:a<=25?1.12:a<=27?1.0:a<=29?0.85:a<=31?0.62:a<=33?0.4:0.22;if(a<=25)m+=Math.max(0,p.pot-p.ovr)*0.03;if(a<=27)m+={N:0,S:0.03,E:0.08,F:0.14}[p.dev]||0;if(p.xf)m+=0.08;
  return Math.round(v*m*10)/10;}
const nextDraftYr=()=>S.season+1+(S.phase==='preseason'?1:0);
function strengthRank(id){const key=t=>ratings(t).ovr+(t.w-t.l)*0.7;const arr=S.teams.slice().sort((a,b)=>key(a)-key(b));return arr.findIndex(t=>t.id===id)/31;}
function pickValue(k){let f=1.3-0.6*strengthRank(k.orig),v=[13,6,2.6][k.rd-1];if(k.yr>nextDraftYr()){v*=0.8;f=1+(f-1)*0.5;}return Math.round(v*f*10)/10;}
const pickName=k=>k.yr+' Round '+k.rd+(k.orig!==k.own?' (from '+S.teams[k.orig].name+')':'');
const teamPicks=id=>S.picks.filter(k=>k.own===id).sort((a,b)=>a.yr-b.yr||a.rd-b.rd);
function lowestStarter(T,pos,exclude){const a=T.roster.filter(p=>p.pos===pos&&!exclude.includes(p)).sort((x,y)=>y.ovr-x.ovr),n=START_N[pos];return a.length>=n?a[n-1].ovr:0;}
// How team T sees a deal where it receives players `gets` + picks `getsK` and sends `gives` + `givesK`.
function aiEval(T,gets,gives,getsK,givesK){let gv=0,ov=0;
  for(const p of gets){const low=lowestStarter(T,p.pos,gives);gv+=tradeValue(p)*(p.ovr>low?(p.ovr>low+4?1.3:1.15):0.65);}
  for(const p of gives){let m=isStarter(T,p)?1.12:0.95;if(p.pos==='QB'&&isStarter(T,p)&&p.ovr>=82)m=1.7;ov+=tradeValue(p)*m;}
  for(const k of getsK||[])gv+=pickValue(k);for(const k of givesK||[])ov+=pickValue(k)*1.08;
  return {gv,ov,ratio:ov>0?gv/ov:(gv>0?9:0)};}
function rosterIssue(T,out,inn){const r=T.roster.filter(p=>!out.includes(p)).concat(inn);
  if(r.length>ROSTER_MAX)return 'would have more than '+ROSTER_MAX+' players';
  for(const pos of POS_ORDER)if(r.filter(p=>p.pos===pos).length<START_N[pos])return 'would be short at '+pos;return '';}
function fixNums(T){const all=new Set(T.roster.map(p=>p.num)),seen=new Set();
  for(const p of T.roster){if(seen.has(p.num))p.num=numFor(p.pos,all);seen.add(p.num);}}
function assetNames(ps,ks){return ps.map(p=>p.pos+' '+p.n).concat(ks.map(k=>'a '+k.yr+' round '+k.rd+' pick')).join(', ');}
function execTrade(A,aOut,aK,B,bOut,bK){A.roster=A.roster.filter(p=>!aOut.includes(p)).concat(bOut);B.roster=B.roster.filter(p=>!bOut.includes(p)).concat(aOut);
  for(const k of aK)k.own=B.id;for(const k of bK)k.own=A.id;for(const p of aOut.concat(bOut))p.cap=p.kr=false;fixNums(A);fixNums(B);
  S.news.unshift('Trade: '+A.name+' send '+assetNames(aOut,aK)+' to '+B.name+' for '+assetNames(bOut,bK)+'.');save();}
function tradesOpen(){return S.phase==='offseason'||S.phase==='preseason'||(S.phase==='regular'&&S.week<TRADE_DEADLINE);}
function proposeTrade(T,give,get,giveK,getK){const U=S.teams[S.user];
  if(!tradesOpen())return {ok:false,msg:S.phase==='draft'?'Trades are closed during the draft.':'The trade deadline has passed.'};
  if(!(give.length+giveK.length)||!(get.length+getK.length))return {ok:false,msg:'Pick at least one player or pick on each side.'};
  let iss=rosterIssue(U,give,get);if(iss)return {ok:false,msg:'Your team '+iss+'.'};
  iss=rosterIssue(T,get,give);if(iss)return {ok:false,msg:T.name+' '+iss+'.'};
  const ev=aiEval(T,give,get,giveK,getK);
  if(ev.ratio<1.03)return {ok:false,msg:T.name+' say no. '+(ev.ratio<0.7?'They want a lot more back.':'They want a little more value.')};
  execTrade(U,give,giveK,T,get,getK);return {ok:true,msg:'Trade accepted.'};}
function makeOffer(){S.offer=null;if(S.mode==='pro')return;if(Math.random()>0.45)return;const U=S.teams[S.user];
  for(let i=0;i<120;i++){const T=pick(S.teams);if(T.id===S.user)continue;const P=pick(U.roster);if(P.pos==='K'||(P.pos==='QB'&&isStarter(U,P)))continue;const vp=tradeValue(P);if(vp<2.5)continue;

function proHuddle(){const P=gm.pro,uo=uoff();

  if(!gm.conv&&gm.q!==5&&(gm.q===2||(gm.q===4&&lead>=-3&&lead<=0))&&gm.clock<=12&&d<=54)return aiKick(false,'U');
  if(!gm.conv&&gm.down===4){const goal=gm.pos+gm.toGo>=100;
    if(gm.q===5){if(d<=52)return aiKick(false,'U');}
    else if(!((gm.toGo<=1&&gm.pos>=45)||(goal&&gm.toGo<=2)||(gm.q===4&&behind&&gm.clock<180&&(lead<-3||d>52)))){if(d<=52)return aiKick(false,'U');return punt();}}

  const want=Math.random()<pp?'pass':'run',c=pickPlays(sit,10).filter(p=>p.g!=='T'&&!p.fake&&!p.sneak);
  let pool=c.filter(p=>p.t===want);if(!pool.length)pool=c.length?c:PB.filter(p=>p.t===want&&p.g!=='T'&&!p.fake);
  if(want==='pass'){const mine=pool.filter(p=>p.r&&p.r[role]);if(mine.length&&Math.random()<0.8)pool=mine;}
  callPlay(pool[0]);}

  return `<div class="scroll"><table class="tbl sm"><thead><tr><th class="l">Season</th><th>Team</th><th>Ovr</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${H.map(h=>row(h.y,h.t,h.o,h.s)).join('')}${cur?row(S.season+' (your games)',S.teams[S.user].abbr,p.ovr,cur):''}</tbody></table></div>`;}

function audPanel(g){if(g.aud==='list'){const cur=g.play;g.audList=pickPlays(situation(),6).filter(p=>p!==cur).slice(0,4);

// ----- home -----

function vHome(){if(S.phase==='draft')return vDraft();const U=S.teams[S.user],r=ratings(U);let h='<div class="wrap">';

    h+=`<section class="card hero"><p class="eyebrow">${S.season} season complete</p><h2>${ch.id===S.user?'You won the Gridiron Bowl':ch.name+' won the Gridiron Bowl'}</h2><p class="muted">Trades and free agency are open. When you start the draft, every player ages a year first: young players improve at a pace set by their potential, veterans decline, and some retire.</p><div class="row"><button class="btn" data-a="startDraft">Start the ${S.season+1} draft</button></div></section>`;}
  else if(S.phase==='preseason'){const over=U.roster.length-ROSTER_MAX;

  else{const m=userMatch(),lab=S.phase==='regular'?'Week '+(S.week+1)+' of '+S.schedule.length:roundName();
    if(m&&UI.setup)h+=setupCard(lab);
    else if(m){const home=m.h===S.user,opp=S.teams[home?m.a:m.h],rival=U.conf===opp.conf&&U.div===opp.div;
      h+=`<section class="card hero"><p class="eyebrow">${lab} · ${home?'Home':'Away'}${rival?' · Division game':''}</p><div class="match">${teamBlock(U,r)}<span class="vs">${home?'vs':'at'}</span>${teamBlock(opp,ratings(opp))}</div><div class="row"><button class="btn" data-a="play">Play game</button><button class="btn ghost" data-a="sim">Sim game</button></div></section>`;}
    else if(S.phase==='regular')h+=`<section class="card hero"><p class="eyebrow">${lab}</p><h2>Bye week</h2><p class="muted">No game for you this week. The rest of the league plays on.</p><div class="row"><button class="btn" data-a="sim">Continue</button></div></section>`;
    else{const alive=S.po&&(S.po.alive.A.includes(S.user)||S.po.alive.N.includes(S.user));
      h+=`<section class="card hero"><p class="eyebrow">${lab}</p><h2>${alive?'You earned a first-round bye':'Your season is over'}</h2><div class="row"><button class="btn" data-a="sim">${alive?'Continue':'Sim this round'}</button></div></section>`;}}
  if(UI.two)h=h.replace('<div class="wrap">','<div class="wrap">'+twoCard());if(UI.quick)h=h.replace('<div class="wrap">','<div class="wrap">'+quickCard());
  h+=offerCard();if(S.phase==='offseason'||S.phase==='preseason')h+=awardsCard();if(!UI.setup){h+=practiceCard();if(!UI.quick)h+=quickCard();if(!UI.two)h+=twoCard();h+=proCard();}
  if(S.news.length)h+='<section class="card"><h3>News</h3><ul class="news">'+S.news.slice(0,8).map(n=>`<li>${esc(n)}</li>`).join('')+'</ul></section>';
  if(!UI.setup)h+=`<section class="card"><h3>Settings</h3>${settingsRow()}<p class="muted">Rookie is forgiving. Legend makes defenders faster to react, tackles surer, and the other team's quarterback sharper.</p></section><section class="card"><h3>Broadcast sound</h3>${voiceRow()}</section>`;
  h+=`<section class="card"><h3>How to play</h3><ul class="news"><li><b>Offense:</b> the coach suggests plays for the situation, or open the full playbook by type. Snap with <b>Space</b> or a tap, move with <b>WASD</b> or the arrow keys (drag on a phone). Each receiver has his own route color and number; press the number or tap him to throw. <b>Space</b> jukes.</li><li><b>Defense:</b> pick a coverage, then steer the player with the blue marker. Run into the ball carrier to tackle, press <b>Space</b> to dive at him, or press it as a pass arrives to swat it. <b>Q</b> switches to the defender nearest the ball.</li><li><b>After a touchdown:</b> choose a celebration, then kick the extra point or go for two.</li><li><b>X-Factors:</b> stars marked X switch on after a couple of good plays, shown by a gold ring and X. The bar at the bottom of the field shows who has the ball and whether his ability is on.</li><li><b>Clock:</b> after a play that ends in bounds the game clock keeps running while you pick the next play. Snap before the play clock hits zero or it's delay of game. Each team has 3 timeouts per half (press <b>T</b>). <b>Sim drive</b> plays out the rest of a possession for you.</li><li><b>Ball carrier moves:</b> Space jukes, E or F spins. Pick off a pass and you run it back.</li><li><b>Injuries:</b> now and then a player gets hurt and misses a few weeks. His backup starts until he's healthy.</li><li><b>Playbook:</b> two-back sets (Pro I, Split backs) and a Trick plays tab with a flea flicker, a reverse, hook and lateral, and, on fourth down, fake punts and fake field goals. At the line, Audible changes the play and Hot route changes one player's route.</li><li><b>Laterals and fumbles:</b> press <b>L</b> (or Pitch) to pitch the ball back to a teammate. Hard hits can knock the ball loose; steer your player onto it to recover.</li><li><b>Clock tools:</b> Hurry-up (<b>H</b>) keeps less time running between plays, Spike (<b>K</b>) stops the clock for a down, and you can try an onside kick when you kick off.</li><li><b>Weather:</b> rain and snow make the ball harder to throw, catch and hold; wind moves passes and kicks. Domes stay dry. Some games are at night.</li><li><b>Replays:</b> after any play press <b>R</b> (or Replay) to watch it again from four camera angles, in slow motion. After the game, watch the highlights.</li><li><b>Flags:</b> when the other team commits a foul you choose to accept the yards or decline and keep the play.</li><li><b>Captains and returner:</b> on the Roster tab, tap a player to make him a captain (up to 4, each plays 2 points better) or your kick returner.</li><li><b>Training points:</b> earned every game. Spend them on the Roster tab to raise ratings or sign free agents.</li></ul><div class="row"><button class="btn ghost sm" data-a="newFr">${UI.confirmNew?'Tap again to erase this franchise':'Start a new franchise'}</button></div></section>`;

// ----- roster, free agents and player editor -----

// ----- trades -----
function trRow(p,on,act,T){return `<button class="prow${on?' on':''}" data-a="${act}" data-id="${p.id}" aria-pressed="${on}"><span class="pos">${p.pos}</span><span class="nm">${esc(p.n)}${xfTag(p)}${isStarter(T,p)?' <span class="tag">S</span>':''}</span><span class="muted">${p.age}y</span><span class="ovr">${p.ovr}</span><span class="muted">${tradeValue(p).toFixed(1)}</span></button>`;}
function pkRow(k,on,act){return `<button class="prow pk${on?' on':''}" data-a="${act}" data-id="${k.id}" aria-pressed="${on}"><span class="pos">PK</span><span class="nm">${pickName(k)}</span><span class="muted"></span><span class="ovr">R${k.rd}</span><span class="muted">${pickValue(k).toFixed(1)}</span></button>`;}
function vTrade(){const U=S.teams[S.user],tr=UI.tr;if(tr.team<0||tr.team===S.user)tr.team=S.teams.find(t=>t.id!==S.user).id;const T=S.teams[tr.team];

  const give=tr.give.map(id=>byId(U,id)),get=tr.get.map(id=>byId(T,id)),gk=tr.gk.map(pkById),tk=tr.tk.map(pkById),open=tradesOpen(),nG=give.length+gk.length,nT=get.length+tk.length;

  h+=`<div class="row"><label for="trTeam">Trade with</label><select id="trTeam">${S.teams.filter(t=>t.id!==S.user).map(t=>`<option value="${t.id}"${t.id===T.id?' selected':''}>${t.name} (${t.w}-${t.l})</option>`).join('')}</select><span class="muted">Pick up to 5 players or draft picks on each side. The last column is trade value. Picks always run two drafts ahead.</span></div>`;

  const left=D.order.slice(D.i).map(pkById).filter(k=>k.own===S.user);
  let h=`<div class="wrap"><section class="card hero"><p class="eyebrow">${D.yr} draft · Round ${pk.rd} · Pick ${D.i+1} of ${D.order.length}</p><h2>${mine?'You are on the clock':sw(T)+' '+T.name+' are on the clock'}</h2>
  <p class="muted">${left.length?'Your picks left: '+left.map(k=>'Round '+k.rd+(k.orig!==k.own?' (from '+S.teams[k.orig].name+')':'')).join(', ')+'.':'You have no picks left in this draft.'}</p>
  <div class="row">${mine?'<button class="btn ghost" data-a="draftAuto">Pick the best fit for me</button>':`<button class="btn" data-a="draftSim">${left.length?'Sim to my next pick':'Sim the rest of the draft'}</button>`}</div></section>`;
  if(mine){const F=['ALL',...POS_ORDER],pool=D.pool.filter(p=>UI.dpos==='ALL'||p.pos===UI.dpos).slice(0,40);

document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='trTeam'){const tr=UI.tr;tr.team=+t.value;tr.get=[];tr.tk=[];tr.msg='';render();}
  else if(t.id==='setDiff'){S.diff=+t.value;save();}else if(t.id==='setSpeed'){S.speed=+t.value;save();}else if(t.id==='setDef'){S.playDef=t.value==='1';save();}else if(t.id==='setKo'){S.koRet=t.value==='1';save();}else if(t.id==='setTalk'){S.talk=+t.value;if(S.talk<2)hush();if(S.talk===3){const c=document.getElementById('cap');if(c)c.hidden=true;}save();}
  else if(t.id==='setV0'||t.id==='setV1'){const w=S.voice||['',''];w[t.id==='setV0'?0:1]=t.value;S.voice=w;voices=null;save();testVoices();}else if(t.id==='setVspd'){S.vspd=+t.value;save();testVoices();}else if(t.id==='setCrowd'){S.crowd=t.value==='1';save();}else if(t.id==='setQlen'){S.qlen=QLENS[+t.value]||4;save();}
  else if(t.id==='qkU'||t.id==='qkO'||t.id==='qkQl'){if(UI.quick){if(t.id==='qkQl')UI.quick.ql=QLENS[+t.value]||2;else UI.quick[t.id==='qkU'?'u':'o']=+t.value;render();}}

function proNewCard(){const P=pnDef(),teams=S.teams.slice().sort((a,b)=>a.name.localeCompare(b.name));
  return `<section class="card hero"><p class="eyebrow">Be a Pro</p><h2>One player. One career.</h2><p class="muted">You only control your own player. On offense the coach calls the plays and the computer runs everyone else; when it's your turn to have the ball, it's all you. When your side is off the field, the game moves along without you.</p></section>
  <section class="card"><h3>Where you start</h3><div class="posgrid two">${[['hs','High school','Senior year. Earn a scholarship, play college ball, then hear your name called at the draft.'],['nfl','NFL rookie','Skip ahead and start as a first-year pro.']].map(([k,n,d])=>`<button class="posb${P.start===k?' on':''}" data-a="pnStart" data-k="${k}" aria-pressed="${P.start===k}"><b>${n}</b><small>${d}</small></button>`).join('')}</div></section>

  <section class="card"><h3>Your player</h3><div class="pform"><label><span>Name</span><input id="pnName" maxlength="22" autocomplete="off" placeholder="First and last name" value="${esc(P.n)}"></label><label><span>Number</span><input id="pnNum" type="number" min="0" max="99" inputmode="numeric" placeholder="Any" value="${esc(P.num)}"></label>
  ${P.start==='nfl'?`<label><span>Team</span><select id="pnTeam"><option value="-1">Let the draft decide</option>${teams.map(T=>`<option value="${T.id}"${P.t===T.id?' selected':''}>${T.name}</option>`).join('')}</select></label>`:`<label><span>High school</span><input id="pnHS" maxlength="24" autocomplete="off" placeholder="Any name, like Lincoln" value="${esc(P.hs)}"></label>`}</div>
  <p class="muted">${P.start==='nfl'?'You start as a 21-year-old rookie, about 70 overall, and you start every game. If the draft decides, one of the weaker teams picks you in the first round.':'You start as a 17-year-old senior, about 56 overall, and you start every game. Play well for scholarship offers, pick your college, and after your junior or senior year, declare for the NFL Draft.'}</p>

    else if(S.phase==='regular')h+=`<section class="card hero"><p class="eyebrow">${lab}</p><h2>Bye week</h2><p class="muted">No game this week. Rest up.</p><div class="row"><button class="btn" data-a="sim">Continue</button></div></section>`;
    else{const alive=S.po&&(S.po.alive.A.includes(S.user)||S.po.alive.N.includes(S.user));h+=`<section class="card hero"><p class="eyebrow">${lab}</p><h2>${alive?'First-round bye':'Your season is over'}</h2><p class="muted">${alive?'Your team earned a week off.':'Your team missed out. Watch the rest of the playoffs.'}</p><div class="row"><button class="btn" data-a="sim">${alive?'Continue':'Sim this round'}</button></div></section>`;}}
  if(!UI.setup)h+=proPlayerCard(p)+proTradeCard(p);
  const L=P.last;if(L&&!UI.setup)h+=`<section class="card"><h3>Last game</h3><p><b>${esc(L.res)}</b>${L.sim?' · simmed':''}</p>${L.line?`<p>${esc(L.line)}</p>`:''}${(L.goals||[]).length?'<ul class="news goals">'+L.goals.map(g=>`<li class="${g.ok?'good':'muted'}">${g.ok?'✓':'✗'} ${esc(g.t)}</li>`).join('')+'</ul>':''}<p class="muted">+${L.xp} XP${L.sp?' · '+L.sp+' new skill point'+(L.sp>1?'s':''):''}</p></section>`;
  if(!UI.setup){h+=`<section class="card"><h3>${S.season} season</h3><p>${esc(proSeasonLine(p,T))}${S.week&&S.phase==='regular'&&S.week>(S.gpU||0)?' <span class="muted">(simmed games are estimated)</span>':''}</p>${careerTable(p)}${(p.aw||[]).length?`<p><b>Awards:</b> ${awSum(p.aw)}</p>`:''}</section>`;
    if(S.road&&S.road.car.length)h+=`<section class="card"><h3>Before the pros</h3>${roadHist()}${S.road.draft?`<p class="muted">${S.road.draft.pick?'Drafted: '+esc(S.road.draft.txt):'Undrafted free agent'}.</p>`:''}</section>`;
    if(S.news.length)h+='<section class="card"><h3>News</h3><ul class="news">'+S.news.slice(0,8).map(n=>`<li>${esc(n)}</li>`).join('')+'</ul></section>';
    h+=`<section class="card"><h3>Settings</h3>${proSettingsRow()}</section><section class="card"><h3>Broadcast sound</h3>${voiceRow()}</section>`;
    h+=`<section class="card"><h3>How Be a Pro works</h3><ul class="news"><li><b>You are one player.</b> A gold marker and YOU sit over him. Only he takes your controls.</li><li><b>Quarterback:</b> you call the plays and throw, just like franchise mode. After a handoff or a catch, the computer runs with it.</li><li><b>Running back, receiver or tight end:</b> the coach calls the play and tells you your job. Press Ready (Space) to snap. Routes run on their own; when the ball comes to you, it's yours: move, juke (Space), spin (E) and pitch (L).</li><li><b>Defense:</b> the coach picks the call; you play it. Move with WASD or the arrows, dive or swat with Space.</li><li><b>When your side is off the field</b>, the other half of the game is simulated so you only play your own snaps. Kicks are automatic.</li><li><b>XP:</b> every catch, yard, tackle and touchdown earns XP, each game goal met earns 50, and a win adds 25. Every ${PRO_XP} XP is a skill point to spend on overall or speed.</li><li><b>Seasons:</b> awards are based on how you play. Retire any time after 30, or play until 40, and see if you make the Hall of Fame.</li></ul>
    <div class="row">${hasSave(KEY)?'<button class="btn ghost sm" data-a="toFr">Go to your franchise</button>':''}<button class="btn ghost sm" data-a="pnNew">${UI.confirmNew?'Tap again to erase this career':'Start a new pro'}</button></div></section>`;}
  $('#view').innerHTML=h+'</div>';}
function vProTeam(){const T=onRoad()?S.road.team:S.teams[S.user],r=ratings(T),me=S.pro.id;let h=`<div class="wrap"><section class="card"><div class="match">${teamBlock(T,r)}</div><p class="muted">Your coach runs the roster. Starters are marked.</p><div class="scroll"><table class="tbl"><thead><tr><th class="l">Pos</th><th>#</th><th class="l">Player</th><th>Age</th><th>Ovr</th><th>Spd</th></tr></thead><tbody>`;
  for(const p of T.roster.slice().sort((a,b)=>posRank(a)-posRank(b))){const st=isStarter(T,p);h+=`<tr class="${p.id===me?'me':''}"><td class="l">${p.pos}</td><td>${p.num}</td><td class="l">${st?'<b>':''}${esc(p.n)}${st?'</b>':''}${xfTag(p)}${p.id===me?' <span class="chip">You</span>':''}${p.inj?' <span class="tag inj">Out '+p.inj+'</span>':''}</td><td>${p.age}</td><td>${p.ovr}</td><td>${p.spd}</td></tr>`;}
  $('#view').innerHTML=h+'</tbody></table></div></section></div>';}

function proPanel(g,kb){const ph=g.phase,uo=g.poss==='U',P=g.pro,pe=proEnt();if(g.ko||!pe)return null;
  const call=uo?g.play.n:DCALLS[g.defCall].n,sim='<button class="btn ghost sm" data-a="simDrive">Sim drive</button>';
  if(ph==='presnap'&&(!uo||P.pos!=='QB'))return `<div class="row"><button class="btn" data-a="snap">Ready${kb('Space')}</button>${sim}<span class="muted">Coach's call: <b>${esc(call)}</b>. ${proJob(g)}</span></div>`;
  if(ph!=='live'||g.loose)return null;const c=g.carrier,b=g.ball;
  if(c===pe&&(g.ret||g.mode==='run'))return coarse?`<div class="pad"><span class="muted">${g.ret?'Run it back! ':''}Drag to steer.</span><span class="row"><button class="btn ghost" data-a="lateral">Pitch</button><button class="btn ghost" data-a="spin">Spin</button><button class="btn" data-a="juke">Juke</button></span></div>`:`<div class="row"><span class="muted">${g.ret?'Run it back! ':'It\'s yours! '}Move: WASD or arrows. Juke: Space. Spin: E or F. Pitch it back: L.</span></div>`;
  if(c===pe)return null;
  if(g.ctl===pe&&!(c&&c.team==='U'))return coarse?`<div class="pad"><span class="muted">${g.ret?'Chase him down! ':''}Drag to move.</span><span class="row"><button class="btn" data-a="dive">Tackle</button></span></div>`:`<div class="row"><span class="muted">${g.ret?'Chase him down! ':''}Move: WASD or arrows. Dive tackle${uo?'':' or swat a pass'}: Space.</span></div>`;
  return `<div class="row"><span class="muted">${b&&b.fly&&b.target===pe?'Here it comes. Look for it!':uo?'Keep working. You take over if the ball comes to you.':'Your teammate has it.'}</span></div>`;}

function awSum(a){const m=new Map();for(const x of a)m.set(x,(m.get(x)||0)+1);return [...m].map(([k,n])=>(n>1?n+'× ':'')+esc(k)).join(' · ');}
function proXFBlock(p){const P=S.pro;P.xfs=P.xfs||[];if(p.xf&&!P.xfs.includes(p.xf))P.xfs.push(p.xf);const n=P.xfs.length,need=PRO_XF_OVR[n];
  return `<div class="xfrow"><p class="eyebrow">X-Factors</p><p class="muted">Unlock up to three for ${PRO_XF_COST} skill points each, at ${PRO_XF_OVR.join(', ')} overall. Equip one at a time. ${XFON[p.pos]}</p><div class="xfgrid">${XFS[p.pos].map(([k,nm,d])=>{const own=P.xfs.includes(k),on=p.xf===k;
    return `<div class="xfc${on?' on':''}"><b>${on?'<span class="xf">X</span> ':''}${nm}</b><small>${d}</small>${P.done?'':on?'<span class="chip">Equipped</span>':own?`<button class="btn ghost sm" data-a="proXF" data-k="${k}">Equip</button>`:n>=3?'':`<button class="btn ghost sm" data-a="proXF" data-k="${k}"${p.ovr>=need&&P.sp>=PRO_XF_COST?'':' disabled'}>${p.ovr>=need?'Unlock · '+PRO_XF_COST+' pts':'Unlocks at '+need}</button>`}</div>`;}).join('')}</div></div>`;}
function proTradeCard(p){if(S.pro.done||onRoad())return '';const open=proTradeOpen(),su=open?proSuitors():[];
  return `<section class="card"><h3>Request a trade</h3>${!open?`<p class="muted">The trade deadline has passed. Requests open again in the offseason.</p>`:su.length?`<p class="muted">These teams would start you at ${p.pos}. Trades go through right away.</p><div class="row"><select id="proTeam" aria-label="Team to be traded to">${su.map(t=>`<option value="${t.id}">${t.name} (${t.w}-${t.l}, ${ratings(t).ovr} OVR)</option>`).join('')}</select><button class="btn ghost sm" data-a="proTr">Request trade</button></div>`:`<p class="muted">No team would start you over their ${p.pos} right now. Raise your overall and ask again.</p>`}</section>`;}
function roadHist(){const R=S.road,p=proP();if(!R||!R.car||!R.car.length)return '';return `<div class="scroll"><table class="tbl sm"><thead><tr><th class="l">Season</th><th>Record</th><th>GP</th><th class="l">Stats</th><th class="l">Honors</th></tr></thead><tbody>${R.car.map(c=>`<tr><td class="l">${esc(c.lab)}</td><td>${c.w}-${c.l}</td><td>${c.gp}</td><td class="l">${esc(proLine(c.st,p.pos))}</td><td class="l">${c.aw.map(esc).join(', ')||'—'}</td></tr>`).join('')}</tbody></table></div>`;}
function renderRoad(){const R=S.road,p=proP(),T=R.team;S.pro.xfs=S.pro.xfs||[];
  $('#top').innerHTML=`<div class="who">${sw(T,'lg')}<div><h1>${esc(p.n)}</h1><div class="meta">#${p.num} · ${p.pos} · ${esc(roadLabel())}</div></div></div><div class="stat">${p.ovr}<small>Overall</small></div>`;
  if(!['home','team'].includes(UI.tab))UI.tab='home';$('#tabs').hidden=false;
  $('#tabs').innerHTML=[['home','Career'],['team','Team']].map(t=>`<button data-a="tab" data-t="${t[0]}" class="${UI.tab===t[0]?'on':''}">${t[1]}</button>`).join('');
  (UI.tab==='team'?vProTeam:vRoad)();}
const stars=n=>'<span class="stars" aria-label="'+n+' stars">'+'★'.repeat(n)+'<span>'+'★'.repeat(5-n)+'</span></span>';
function vRoad(){const R=S.road,p=proP(),T=R.team,P=S.pro,m=roadMatch(),hs=R.stage==='hs';let h='<div class="wrap">';
  if(m){h+=`<section class="card hero"><p class="eyebrow">${esc(roadLabel())} · ${esc(m.lab)} · ${m.home?'Home':'Away'}</p><div class="match">${teamBlock(T,ratings(T))}<span class="vs">${m.home?'vs':'at'}</span>${teamBlock(m.opp,ratings(m.opp))}</div>
    <p class="eyebrow">Game goals · 50 XP each</p><ul class="news goals">${(P.goals||[]).map(g=>`<li>${esc(g.t)}</li>`).join('')}</ul>
    <div class="row"><button class="btn" data-a="play">Play game</button><button class="btn ghost" data-a="sim">Sim game</button><button class="btn ghost sm" data-a="roadAll">Sim the rest of the season</button></div>
    <p class="muted">${hs?'College scouts are in the stands. ':'NFL scouts are watching. '}Playing earns XP for everything you do; a simmed game earns 40, plus 10 for a win.</p></section>`;}
  else if(R.stage==='hs'||R.stage==='col'){const s=R.sea,nx=R.stage==='col'?R.yr+1:0;
    h+=`<section class="card hero"><p class="eyebrow">${esc(roadLabel())} · season over</p><h2>${T.w}-${T.l}${s.champ?' · '+esc(s.champ):''}</h2><p>${esc(proLine(s.st,p.pos))} in ${s.gp} games.</p>${s.aw.length?`<p><b>Honors:</b> ${s.aw.map(esc).join(' · ')}</p>`:'<p class="muted">No honors this year.</p>'}
    <div class="row">${hs?'<button class="btn" data-a="roadNext">See your scholarship offers</button>':R.yr<2?`<button class="btn" data-a="roadNext">Start your ${CLASS_YR[nx].toLowerCase()} year</button>`:`<button class="btn" data-a="roadDeclare">Declare for the NFL Draft</button>${R.yr===2?'<button class="btn ghost" data-a="roadNext">Come back for your senior year</button>':''}`}</div>
    ${!hs&&R.yr>=2?`<p class="muted">Draft outlook: ${roadProjection().txt}.</p>`:''}</section>`;}
  else if(R.stage==='offers'){h+=`<section class="card hero"><p class="eyebrow">Recruiting</p><h2>${stars(R.stars)} ${R.stars}-star prospect</h2><p class="muted">Pick where you play college ball. Bigger programs play tougher schedules, win more, and get more national attention at draft time.</p></section>
    <div class="offers">${R.offers.map(i=>{const c=COLLEGES[i];return `<section class="card offer"><div class="tb"><span class="sw lg" style="--a:${c[2]};--b:${c[3]}"></span><div><b>${esc(c[0])}</b><span>Program ${stars(Math.max(1,Math.round(c[4]/2)))}</span></div></div><button class="btn sm" data-a="roadCommit" data-k="${i}">Commit</button></section>`;}).join('')}</div>`;}
  else if(R.stage==='draft'){const pr=roadProjection(),D=R.draft;
    h+=D?`<section class="card hero"><p class="eyebrow">${S.season} NFL Draft · ${esc(D.txt)}</p><h2>${D.pick?'With pick '+D.pick+', '+esc(S.teams[D.tid].name)+' select '+esc(p.n):esc(p.n)+' signs with '+esc(S.teams[D.tid].name)}</h2><div class="match">${teamBlock(S.teams[D.tid],ratings(S.teams[D.tid]))}</div><div class="row"><button class="btn" data-a="roadNFL">Start your NFL career</button></div></section>`
      :`<section class="card hero"><p class="eyebrow">${S.season} NFL Draft</p><h2>Draft day</h2><p>Scouts project you as ${pr.txt}.</p><div class="row"><button class="btn" data-a="roadDraft">Go to the draft</button></div></section>`;}
  h+=proPlayerCard(p);
  const L=P.last;if(L)h+=`<section class="card"><h3>Last game</h3><p><b>${esc(L.res)}</b>${L.sim?' · simmed':''}</p>${L.line?`<p>${esc(L.line)}</p>`:''}${(L.goals||[]).length?'<ul class="news goals">'+L.goals.map(g=>`<li class="${g.ok?'good':'muted'}">${g.ok?'✓':'✗'} ${esc(g.t)}</li>`).join('')+'</ul>':''}<p class="muted">+${L.xp} XP${L.sp?' · '+L.sp+' new skill point'+(L.sp>1?'s':''):''}</p></section>`;
  if(m&&R.sea)h+=`<section class="card"><h3>This season</h3><p>${T.w}-${T.l} · ${esc(R.sea.gp?proLine(R.sea.st,p.pos):'No games yet')}</p></section>`;
  if(R.car.length)h+=`<section class="card"><h3>Before the pros</h3>${roadHist()}</section>`;
  if(S.news.length)h+='<section class="card"><h3>News</h3><ul class="news">'+S.news.slice(0,8).map(n=>`<li>${esc(n)}</li>`).join('')+'</ul></section>';
  h+=`<section class="card"><h3>Settings</h3>${proSettingsRow()}</section><section class="card"><h3>Road to the Pros</h3><ul class="news"><li><b>High school:</b> one senior season of 8 games, plus the state playoffs if you win 5. Your play and honors decide your star rating and which colleges offer.</li><li><b>College:</b> 10 games a year. Win 6 for a bowl game; win 9 for the playoff and a shot at the national title. Big seasons earn All-Conference, All-American and the Heisman.</li><li><b>The draft:</b> declare after your junior or senior year. Your overall and college honors decide where you go.</li><li>XP and skill points work the same as in the NFL, and you can unlock X-Factors once you reach ${PRO_XF_OVR[0]} overall.</li></ul>
    <div class="row">${hasSave(KEY)?'<button class="btn ghost sm" data-a="toFr">Go to your franchise</button>':''}<button class="btn ghost sm" data-a="pnNew">${UI.confirmNew?'Tap again to erase this career':'Start a new pro'}</button></div></section>`;
  $('#view').innerHTML=h+'</div>';}
function roadPlay(){const R=S.road,m=roadMatch(),p=proP();if(!m)return;const T=R.team,uU=m.home?'H':'A',uO=fixClash(m.opp,m.home?'A':'H',{T,key:uU});
  startGame(m.opp,m.home,uU,uO,{U:T,road:true,pro:{id:p.id,pos:p.pos,n:p.n}});}
function roadSim(){const m=roadMatch(),R=S.road,P=S.pro;if(!m)return;const T=R.team,sc=m.home?simGame(T,m.opp):simGame(m.opp,T),us=m.home?sc[0]:sc[1],th=m.home?sc[1]:sc[0],xp=40+(us>th?10:0);
  P.games++;const sp=proGain(xp);P.last={sim:true,xp,sp,res:(us>th?'Won ':'Lost ')+us+'-'+th};proGoals();roadResult(us,th,null);}

</script>
</body>
