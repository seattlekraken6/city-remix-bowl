<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="City Gridiron: a 3D low-poly football game you play in the browser.">
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>City Gridiron</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a scoreboard header, one scrolling view, a bottom tab bar. The match takes over the whole screen. */
:root{
  color-scheme:dark;
  --bg:#0c1411;--panel:#131e19;--panel2:#1b2a22;--line:#2a3c33;--fg:#e8efe9;--muted:#8fa297;
  --chalk:#f4c430;--ink:#141a12;--good:#4cc47a;--bad:#e5604f;--sel:#2b2812;--stage:#06090b;--glow:#ffffff;--mat:#55705f;--mat2:#6d8a78;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
#app{height:100%;display:flex;flex-direction:column}
#top,#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top{display:flex;align-items:center;gap:12px;padding-block:10px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .who{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
#top h1{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
#top .meta{color:var(--muted);font-size:13px;margin-top:2px}
#top .stat{text-align:right;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
#top .stat small{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sw{display:inline-block;width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--a) 0 56%,var(--b) 56%);box-shadow:0 0 0 1px rgba(255,255,255,.25);flex:none;vertical-align:-4px}
.sw.lg{width:42px;height:42px;border-radius:9px}
#view{flex:1;min-height:0;overflow-y:auto;padding-block:16px}
.wrap{max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
#tabs{display:flex;background:var(--panel);border-top:1px solid var(--line)}
#tabs button{flex:1;min-width:0;background:none;border:0;border-top:3px solid transparent;padding:11px 4px 12px;font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#tabs button.on{color:var(--fg);border-top-color:var(--chalk)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.hero{background:linear-gradient(180deg,var(--panel2),var(--panel))}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk);margin:0 0 8px;font-weight:600}
h2{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.02;margin:0 0 8px;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
h3{font-family:var(--display);font-size:21px;font-weight:600;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}
p{margin:0 0 8px;max-width:68ch}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sp{margin-top:10px}
.btn{background:var(--chalk);color:var(--ink);border:0;border-radius:8px;padding:9px 18px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost.sel{box-shadow:inset 0 0 0 2px var(--chalk)}
.btn.sm{padding:6px 12px;font-size:16px}
.btn:disabled{opacity:.4;cursor:default}
.match{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.tb{display:flex;align-items:center;gap:12px;flex:1;min-width:170px}
.tb b{font-family:var(--display);font-size:27px;text-transform:uppercase;line-height:1;display:block}
.tb span{color:var(--muted);font-size:13px}
.vs{font-family:var(--display);color:var(--muted);font-size:19px;text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;gap:6px;margin-top:5px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-variant-numeric:tabular-nums;color:var(--fg)!important}
.news{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:7px}
.news li{padding-left:12px;border-left:2px solid var(--line)}
.news+.row{margin-top:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.pick button{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:left;min-width:0}
.pick button:hover,.play:hover,.prow:hover{border-color:var(--muted)}
.pick b{display:block;font-family:var(--display);font-size:19px;text-transform:uppercase;line-height:1.05}
.pick small{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 8px;text-align:right}
.tbl td{padding:7px 8px;border-top:1px solid var(--line);text-align:right}
.tbl .l{text-align:left}
.tbl .ovr,.prow .ovr{font-family:var(--display);font-size:19px;font-weight:700}
.tbl tr.st td{background:var(--panel2)}
.tbl tr.me td{background:var(--sel)}
.tbl tr.div td{font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk);border-top:0;padding-top:12px}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px}
.tr-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.plist{display:flex;flex-direction:column;gap:4px;max-height:330px;overflow-y:auto;padding-right:2px}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto auto;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:left;font-variant-numeric:tabular-nums;font-size:14px}
.prow.on{border-color:var(--chalk);background:var(--sel)}
.prow .pos{font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted)}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{flex:1;min-width:120px;max-width:260px;height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bad)}
.meter.ok i{background:var(--good)}
.tr-sum .row{margin-bottom:8px}

#game{position:fixed;inset:0;z-index:50;background:var(--stage);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#bug{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-family:var(--display)}
#bug .tm{display:flex;align-items:center;gap:7px;font-size:24px;font-weight:700;line-height:1}
#bug .tm i{font-style:normal;min-width:1.3em;text-align:center;font-variant-numeric:tabular-nums;color:var(--chalk)}
#bug .mid{flex:1;text-align:center;line-height:1.1;min-width:0}
#bug .mid b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
#bug .mid span{font-size:15px;color:var(--muted);white-space:nowrap;letter-spacing:.03em}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#flash{position:absolute;left:50%;top:14%;transform:translateX(-50%);max-width:94%;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,48px);line-height:1;text-transform:uppercase;letter-spacing:.03em;color:var(--glow);text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px rgba(0,0,0,.55);pointer-events:none;opacity:0;transition:opacity .18s}
#flash.on{opacity:1}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px;max-height:46%;overflow-y:auto;min-height:58px}
#panel .res{font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.plays{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
.play{display:flex;flex-direction:column;gap:1px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px 7px;text-align:left;min-width:0}
.play svg{width:100%;height:46px;display:block}
.play b{font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.play small{color:var(--muted);font-size:12px;line-height:1.2}
.pl-los{stroke:var(--line);stroke-width:.5}
.pl-rt{fill:none;stroke:var(--chalk);stroke-width:.9;stroke-linejoin:round;stroke-linecap:round}
.pl-dot{fill:var(--fg)}
.pl-ol{fill:var(--muted)}
.kbd{display:inline-block;min-width:1.5em;text-align:center;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:0;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-right:6px;opacity:.7;vertical-align:2px;text-transform:none}
.btn .kbd{margin:0 0 0 8px}
.kick{position:relative;height:22px;background:var(--bg);border:1px solid var(--line);border-radius:6px;flex:1;min-width:160px}
.kick .zone{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);background:var(--good);opacity:.6}
.kick .mk{position:absolute;top:-4px;bottom:-4px;left:0;width:4px;margin-left:-2px;background:var(--chalk);border-radius:2px}
.cardp h3{font-size:26px;margin-bottom:6px}
.cardp .row{margin-top:10px}
#panel.live{touch-action:none}
.pad{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px;border:1px dashed var(--line);border-radius:10px;padding:12px}
.tip{display:none;margin:10px 0 0}
@media (max-width:520px){.uni span{font-size:12px;letter-spacing:0}.uni{padding:6px 0 5px}h2{font-size:28px}#bug{gap:6px;padding:6px 8px}#bug .tm{font-size:19px;gap:5px}#bug .mid b{font-size:16px}#bug .mid span{font-size:12px}#bug .btn{padding:4px 8px;font-size:14px}#bug .wide{display:none}#top h1{font-size:23px}}
@media (orientation:portrait){#stage{flex:none;height:min(78vw,58%)}#panel{flex:1;max-height:none}.pad{min-height:140px}.tip{display:block}}
@media (prefers-reduced-motion:reduce){#flash{transition:none}}

input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
#edName{flex:1;min-width:130px;max-width:260px}#edNum{width:76px}
label{color:var(--muted);font-size:13px}
.xf{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;line-height:1;color:var(--ink);background:var(--chalk);border-radius:3px;padding:2px 5px;margin-left:4px;vertical-align:1px}
.edit{border-color:var(--chalk)}.edit .row{margin-bottom:10px}.edit .row:last-child{margin-bottom:0}.edit h3{margin:0}
.tbl tr.pl{cursor:pointer}.tbl tr.pl:hover td{background:var(--panel2)}.tbl tr.cur td{background:var(--sel)}.tbl tr.out td{opacity:.6}
.tbl tr.pl:focus-visible{outline:2px solid var(--chalk);outline-offset:-2px}
.unis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin:10px 0 14px}
.unicol h3{margin-bottom:6px}
.unirow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.uni{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--mat);border:2px solid var(--line);border-radius:8px;padding:8px 2px 6px;min-width:0}
.uni svg{width:44px;height:70px;max-width:100%}
.uni span{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.uni.on{border-color:var(--chalk);background:var(--mat2)}
.set{margin:4px 0 12px}
.prow.pk{border-style:dashed}.prow.pk .pos{color:var(--chalk)}
.poss{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--chalk)}
.dcalls{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sp{margin-top:10px}
@media (max-width:520px){.uni span{font-size:12px;letter-spacing:0}.uni svg{width:36px;height:57px}}
</style>
</head>

  <div id="stage"><canvas id="cv"></canvas><div id="flash" aria-live="polite"></div></div>
  <div id="panel"></div>
</div>

function numFor(pos,taken){const R=NUM_R[pos];for(let i=0;i<60;i++){const r=pick(R),n=rint(r[0],r[1]);if(!taken.has(n)){taken.add(n);return n;}}for(let n=1;n<100;n++)if(!taken.has(n)){taken.add(n);return n;}return 0;}
const spdFor=(pos,ovr)=>clamp(Math.round(POS_SPD[pos]+(ovr-76)*0.3+rnd(-3,3)),40,99);
function mkPlayer(pos,ovr,age,taken){ovr=clamp(Math.round(ovr),50,99);

function mkPicks(yr){return S_teamsIds().flatMap(t=>[1,2,3].map(rd=>({id:S.pid++,yr,rd,orig:t,own:t})));}

function newLeague(){NID=1;
  const teams=TEAM_DEFS.map((d,i)=>{const taken=new Set(),roster=[];
    for(const r of REAL[d[0]]){let num=r[3];if(taken.has(num))num=numFor(r[1],taken);else taken.add(num);
      roster.push({id:NID++,n:r[0],pos:r[1],age:r[5],ovr:r[2],pot:r[5]<=25?clamp(r[2]+rint(0,7),r[2],99):r[2],spd:spdFor(r[1],r[2]),num,xf:!!r[4]});}
    for(const pos of POS_ORDER)while(roster.filter(p=>p.pos===pos).length<ROSTER_N[pos])roster.push(mkPlayer(pos,rnd(60,67),rint(22,25),taken));

// ===== depth chart and ratings =====
function starters(T,pos){return T.roster.filter(p=>p.pos===pos).sort((a,b)=>b.ovr-a.ovr).slice(0,START_N[pos]);}
function isStarter(T,p){return starters(T,p.pos).includes(p);}
function ratings(T){const avg=pos=>{const a=starters(T,pos);return a.reduce((x,p)=>x+p.ovr+(p.xf?2:0),0)/(a.length||1);};
  const off=(avg('QB')*3+avg('RB')+avg('WR')*2.5+avg('TE')*0.7+avg('OL')*2.8)/10;
  const def=(avg('DL')*3+avg('LB')*2.2+avg('CB')*2.6+avg('S')*2.2)/10;
  return {off:Math.round(off),def:Math.round(def),ovr:Math.round((off+def)/2)};}
function checkXF(T,p){if(!p.xf&&p.ovr>=XF_OVR){p.xf=true;if(T.id===S.user)S.news.unshift(p.n+' ('+p.pos+') earned an X-Factor: '+XF[p.pos][0]+'.');}}

// ===== schedule and simulation =====
function makeSchedule(n=32,weeks=17){const ids=[...Array(n).keys()];shuffle(ids);const rounds=[];
  for(let r=0;r<n-1;r++){const g=[];for(let i=0;i<n/2;i++){const a=ids[i],b=ids[n-1-i];g.push(Math.random()<0.5?{h:a,a:b,hs:null,as:null}:{h:b,a:a,hs:null,as:null});}
    rounds.push(g);ids.splice(1,0,ids.pop());}
  shuffle(rounds);return rounds.slice(0,weeks);}
function simGame(H,A){const rh=ratings(H),ra=ratings(A);
  const f=(o,d,hf)=>{const x=Math.max(0,21+(o-d)*0.6+hf+gauss()*8);const td=Math.floor(x/7);return td*7+Math.min(2,Math.round((x-td*7)/3))*3;};
  let hs=f(rh.off,ra.def,1.5),as=f(ra.off,rh.def,0);if(hs===as){if(Math.random()<0.5)hs+=3;else as+=3;}return [hs,as];}
const cmpTeams=(a,b)=>(b.w/((b.w+b.l)||1))-(a.w/((a.w+a.l)||1))||(b.pf-b.pa)-(a.pf-a.pa)||a.id-b.id;
function currentGames(){if(S.phase==='regular')return S.schedule[S.week]||[];if(S.phase==='playoffs')return S.po.games;return [];}
function userMatch(){return currentGames().find(g=>(g.h===S.user||g.a===S.user)&&g.hs==null)||null;}
function roundName(){if(!S.po)return '';const n=S.po.alive.A.length+S.po.alive.N.length;return n>=14?'Wild Card round':n>=8?'Divisional round':n>=4?'Conference finals':'Gridiron Bowl';}
// Playoff field: four division winners seeded 1-4 by record, then three wild cards seeded 5-7.
function seedsFor(c){const ts=S.teams.filter(t=>t.conf===c);const dw=DIVS.map(d=>ts.filter(t=>t.div===d).sort(cmpTeams)[0]).sort(cmpTeams);
  const rest=ts.filter(t=>!dw.includes(t)).sort(cmpTeams);return {div:dw,wc:rest.slice(0,3),hunt:rest.slice(3,6)};}
function startPlayoffs(){S.phase='playoffs';S.offer=null;const seeds={};
  for(const c of ['A','N']){const s=seedsFor(c);seeds[c]=[...s.div,...s.wc].map(t=>t.id);}
  S.po={seeds,alive:{A:seeds.A.slice(),N:seeds.N.slice()},games:[],log:[]};
  const U=S.teams[S.user],seed=seeds[U.conf].indexOf(S.user);
  S.news.unshift(seed>=0?'You made the playoffs as the '+CONF[U.conf]+' No. '+(seed+1)+' seed'+(seed<4?' (division winner).':' (wild card).'):'You missed the playoffs at '+U.w+'-'+U.l+'.');
  buildRound();}
function buildRound(){const po=S.po;po.games=[];const A=po.alive.A,N=po.alive.N;
  if(A.length===1&&N.length===1){po.games.push({h:A[0],a:N[0],hs:null,as:null,conf:'F'});return;}
  for(const c of ['A','N']){const L=po.alive[c],pool=L.length===7?L.slice(1):L.slice();
    for(let i=0;i<pool.length/2;i++)po.games.push({h:pool[i],a:pool[pool.length-1-i],hs:null,as:null,conf:c});}}
function finishRound(){const po=S.po,losers=po.games.map(g=>g.hs>g.as?g.a:g.h);
  po.log.push({name:roundName(),games:po.games.map(g=>({h:g.h,a:g.a,hs:g.hs,as:g.as}))});
  const fin=po.games.length===1&&po.games[0].conf==='F',g0=po.games[0];
  for(const c of ['A','N'])po.alive[c]=po.alive[c].filter(id=>!losers.includes(id));
  if(fin){S.champ=g0.hs>g0.as?g0.h:g0.a;S.phase='offseason';po.games=[];S.news.unshift(S.teams[S.champ].name+' win the '+S.season+' Gridiron Bowl.');}
  else buildRound();}
function completeStep(played){const games=currentGames();
  for(const g of games)if(g.hs==null){const r=simGame(S.teams[g.h],S.teams[g.a]);g.hs=r[0];g.as=r[1];}
  const ug=games.find(g=>g.h===S.user||g.a===S.user);
  if(ug){const home=ug.h===S.user,us=home?ug.hs:ug.as,th=home?ug.as:ug.hs,opp=S.teams[home?ug.a:ug.h],won=us>th;
    const tp=(played?(won?5:3):(won?2:1))+(S.phase==='playoffs'?2:0);S.tp+=tp;
    S.last=(S.phase==='regular'?'Week '+(S.week+1):roundName())+': '+(won?'Won ':'Lost ')+us+'-'+th+(home?' vs ':' at ')+opp.name+' (+'+tp+' training points)';S.news.unshift(S.last);}
  if(S.phase==='regular'){
    for(const g of games){const H=S.teams[g.h],A=S.teams[g.a];H.pf+=g.hs;H.pa+=g.as;A.pf+=g.as;A.pa+=g.hs;if(g.hs>g.as){H.w++;A.l++;}else{A.w++;H.l++;}}
    S.week++;if(S.week>=S.schedule.length)startPlayoffs();else if(S.week<TRADE_DEADLINE)makeOffer();else{if(S.week===TRADE_DEADLINE)S.news.unshift('The trade deadline has passed. Trades reopen in the offseason.');S.offer=null;}}
  else finishRound();
  if(S.news.length>16)S.news.length=16;save();}
function finishUserGame(us,them){const m=userMatch();if(m){const home=m.h===S.user;m.hs=home?us:them;m.as=home?them:us;}completeStep(true);}

function draftOrder(){const rank=S.teams.slice().sort(cmpTeams).reverse().map(t=>t.id);if(S.champ!=null){rank.splice(rank.indexOf(S.champ),1);rank.push(S.champ);}

// ===== player management =====
const upgradeCost=p=>p.ovr>=99?0:p.ovr<75?1:p.ovr<85?2:p.ovr<92?3:4;

// ===== trades: players and draft picks =====

const nextDraftYr=()=>S.season+1+(S.phase==='preseason'?1:0);
function strengthRank(id){const key=t=>ratings(t).ovr+(t.w-t.l)*0.7;const arr=S.teams.slice().sort((a,b)=>key(a)-key(b));return arr.findIndex(t=>t.id===id)/31;}

// matrices: 3x3 row-major + translation

const BOXF=[[1,3,7,5,1,0,0],[0,2,6,4,-1,0,0],[2,3,7,6,0,1,0],[4,5,7,6,0,0,1],[0,1,3,2,0,0,-1]];

// ===== stadium and field =====

function drawBackdrop(T){const hz=cam.cy-cam.F*Math.tan(cam.pitch);const g=ctx.createLinearGradient(0,0,0,Math.max(1,hz));

// ----- movement -----
function accel(e,wx,wz,dt){const ax=wx-e.vx,az=wz-e.vz,l=Math.hypot(ax,az),m=24*dt;if(l<=m){e.vx=wx;e.vz=wz;}else{e.vx+=ax/l*m;e.vz+=az/l*m;}}

function runRoute(e,dt){const r=e.route;if(e.wp>=r.length){accel(e,0,0,dt);e.face=gm.by.QB;return;}

  if(l<0.55){e.wp++;e.cutT=gm.t;if(e.wp>=r.length){accel(e,0,0,dt);return;}w=r[e.wp];dx=w.x-e.x;dz=w.z-e.z;l=Math.hypot(dx,dz)||1;}

function userInput(){let ix=inp.kx+inp.sx,iz=inp.kz+inp.sz;if(FLIP){ix=-ix;iz=-iz;}const l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l;}return [ix,iz,l];}
function control(e,dt,mode){const [ix0,iz0,l]=userInput();let ix=ix0,iz=iz0;

function juke(){const c=gm&&gm.carrier;if(!c||gm.phase!=='live'||!uoff()||gm.mode!=='run'||c.jukeCd>gm.t)return;c.juke=gm.t+0.34;c.jukeCd=gm.t+2.4;

function blockDur(b,d){const diff=(b.rp.ovr-d.rp.ovr)/55;let base;
  if(gm.play.t==='pass'&&gm.mode==='pocket'&&isOL(b))base=2.5+Math.random()*2.5+(d.dbl?0.9:0);
  else if(isOL(b))base=1.0+Math.random()*1.7;else if(b.role==='TE')base=1.0+Math.random()*1.2;else base=0.5+Math.random()*0.9;

function cover(d,dt){const r=d.cover,t=gm.t;if(r.down){accel(d,0,0,dt);return;}

function deep(d,dt){let dp=null;const sd=d.deepSide;for(const e of gm.elig){if(sd===1&&e.x<gm.bx)continue;if(sd===-1&&e.x>=gm.bx)continue;if(!dp||e.z>dp.z)dp=e;}

function tryTackle(d,c){const t=gm.t,lg=d.lunge>t;if(d.tklCd>t||dist(d,c)>(d.eng?0.85:lg?1.6:1.12))return;d.tklCd=t+0.7;

  if(!qbp){if(c.juke>t)p-=0.22;if(c.zone&&c.rp.pos==='RB')p-=0.18;}
  if(d.zone&&d.rp.pos==='LB')p+=0.15;if(d===gm.ctl)p+=lg?0.18:0.1;if(d.eng)p*=0.22;
  if(Math.random()<clamp(p,0.08,0.97)){c.down=true;c.anim='down';d.down=true;d.anim='dive';d.lunge=0;gm.tkBy=d;

// ----- the other team's offense -----
function nearestRusher(q){let nd=null,dn=99;for(const d of gm.ents){if(d.side!=='D'||d.down||d.eng||d.stun>gm.t)continue;const dd=dist(d,q);if(dd<dn){dn=dd;nd=d;}}return [nd,dn];}

  if(nd&&dn<4.5){tx=qb.x+(qb.x>=nd.x?1:-1)*3;tz=gm.pos-8.5;}
  seek(qb,clamp(tx,gm.bx-7,gm.bx+7),tz,qb.max*0.7,dt);qb.face=gm.throwing?gm.throwing.rec:{x:qb.x,z:qb.z+10};

function aiRun(c,dt){const t=gm.t;if(c===gm.by.QB&&gm.play.t==='run'){accel(c,0,0,dt);return;}

  for(const d of gm.ents){if(d.side!=='D'||d.down||d.stun>t)continue;const ox=c.x-d.x,oz=c.z-d.z,dd=Math.hypot(ox,oz);
    if(dd<7&&oz<1.5){dx+=(ox>=0?1:-1)*(7-dd)/7*1.6*(d.eng?0.4:1);if(!d.eng&&dd<dn){dn=dd;nd=d;}}}

// ----- playing defense -----
function userDefend(d,dt){const t=gm.t,c=gm.carrier;

  if(d.lunge){if(d.lunge>t){d.vx=d.lx*d.max*1.8;d.vz=d.lz*d.max*1.8;if(c)tryTackle(d,c);return;}d.lunge=0;d.stun=t+0.7;d.vx*=0.2;d.vz*=0.2;return;}

    else{accel(d,0,0,dt);d.anim='block';d.face=d.eng;if(c&&gm.mode==='run')tryTackle(d,c);return;}}
  d.anim=gm.swatT!=null&&t-gm.swatT<0.45?'catch':'idle';
  const [ix,iz,l]=userInput();if(l<0.1)accel(d,0,0,dt);else accel(d,ix*d.max*1.03,iz*d.max*1.03,dt);

function dive(){const d=gm&&gm.ctl;if(!d||gm.phase!=='live'||uoff()||d.down||d.stun>gm.t||d.eng||d.lunge)return;

  const c=gm.carrier;let dx,dz;if(c&&dist(d,c)<5){dx=c.x+c.vx*0.15-d.x;dz=c.z+c.vz*0.15-d.z;}else{dx=d.vx;dz=d.vz;}const l=Math.hypot(dx,dz);if(l<0.1)return;

  const arr=gm.ents.filter(d=>d.side==='D'&&!d.down).sort((p,q)=>Math.hypot(p.x-tx,p.z-tz)-Math.hypot(q.x-tx,q.z-tz));if(arr.length<2)return;

// How open a receiver is: the smaller of his gap now and his gap a beat from now.
function openness(e){const f=predictPos(e,0.7);let dn=99;
  for(const d of gm.ents)if(d.side==='D'&&!d.down){const a=Math.hypot(d.x-e.x,d.z-e.z),b=Math.hypot(d.x+d.vx*0.5-f.x,d.z+d.vz*0.5-f.z);dn=Math.min(dn,a,b+0.6);}

// ----- passing -----
function throwTo(rec){const qb=gm.by.QB;if(gm.phase!=='live'||gm.mode!=='pocket'||gm.throwing||gm.carrier!==qb)return;gm.throwing={rec,at:gm.t+0.2};qb.anim='throw';qb.animT=gm.t;}
function releaseBall(rec){const qb=gm.by.QB,rp=qb.rp,uo=uoff(),zq=qb.zone;let T=0.6,land,d=0;

  const pres=gm.ents.some(x=>x.side==='D'&&!x.eng&&!x.down&&dist(x,qb)<2.6),mv=Math.hypot(qb.vx,qb.vz)>2.5;
  const sig=(0.28+d*0.022)*(1+(92-rp.ovr)/45)*(pres?1.7:1)*(mv?1.35:1)*(zq?0.6:1)*(1+(uo?0.1:-0.1)*dk());

// ----- one simulation step while the ball is live -----
function stepLive(dt){gm.t+=dt;const t=gm.t,E=gm.ents,by=gm.by,qb=by.QB,los=gm.pos,play=gm.play,uo=uoff();

  const car=gm.carrier,b=gm.ball;

    if(d.stun>t){accel(d,0,0,dt);continue;}
    if(d.eng){if(t>=d.shedAt||d.eng.down){d.eng.beat=t+1.2;d.eng=null;d.freeUntil=t+3;}
      else{const g=car||qb,bl=d.eng;if(play.t==='run'&&!gm.scr&&isOL(bl)&&g.z<d.z+1)accel(d,(d.x>=gm.bx?1:-1)*0.9,1.5+(bl.rp.ovr-d.rp.ovr)*0.02,dt);else seek(d,g.x,g.z,(isOL(bl)||bl.role==='TE')?0.9+(d.rp.ovr-70)*0.02:d.max*0.5,dt);
        d.anim='block';d.face=bl;if(mode==='run'&&car)tryTackle(d,car);if(gm.phase!=='live')return;continue;}}
    d.anim='idle';const rusher=d.role[0]==='D'||d.blitz;

      else if(d.cover)cover(d,dt);else if(d.deepSide!=null)deep(d,dt);

    else if(mode==='air'){const near=Math.hypot(d.x-b.land.x,d.z-b.land.z);

      else if(t>=gm.thrownAt+d.react&&(d.cover===b.target||((d.deepSide!=null||d.role==='LB1')&&near<11)||near<4.5))seek(d,b.land.x,b.land.z,d.max,dt);

      if(!rusher&&t<read){if(d.cover)cover(d,dt);else accel(d,0,0,dt);}

  if(gm.phase==='live'&&c){if(c.z<-9.5)c.z=-9.5;if(c.z>=100&&Math.abs(c.x)<=FW)endPlay('td',100);else if(Math.abs(c.x)>FW)endPlay('oob',c.z);}}
function stepDead(dt){gm.deadT+=dt;for(const e of gm.ents){if(e.down)continue;accel(e,0,0,dt);e.x+=e.vx*dt;e.z+=e.vz*dt;}
  const b=gm.ball;if(b.fly&&b.y>0.12){b.x+=b.vx*dt;b.z+=b.vz*dt;b.y+=b.vy*dt;b.vy-=b.g*dt;if(b.y<=0.12){b.y=0.12;b.vx=b.vz=0;b.vy=0;}}
  if(gm.zmsg&&gm.deadT>1.0&&gm.deadT<8){flash(gm.zmsg);gm.zmsg='';gm.zext=1.3;}
  if(gm.deadT>(gm.after&&gm.after.scored?2.8:1.9)+(gm.zext||0)){gm.zext=0;gm.zmsg='';afterPlay();}}

// ----- X-Factor zones -----
function zoneUp(e,need){if(!e||!e.rp.xf||e.rp.pos==='OL')return;const z=gm.zone[e.rp.id]||(gm.zone[e.rp.id]={c:0,on:false});if(z.on)return;if(++z.c>=need){z.on=true;e.zone=true;gm.zmsg='X-Factor: '+e.rp.n+' is in the zone';}}
function zoneOut(e){if(!e||!e.rp.xf||e.rp.pos==='OL')return;const z=gm.zone[e.rp.id];if(z){z.c=0;z.on=false;}}

// ----- downs, scoring, clock -----
function tick(sec){if(gm.q===5)return;gm.clock-=sec;if(gm.clock<=0){gm.clock=0;gm.exp=true;}}
function addScore(side,pts){if(side==='U')gm.us+=pts;else gm.them+=pts;}
function endPlay(kind,z,note){if(gm.phase!=='live')return;gm.phase='dead';gm.deadT=0;gm.throwing=null;
  const los=gm.pos,st=gm.st,passed=gm.thrownAt!=null,uo=uoff(),other=uo?'A':'U',by=gm.by,c=gm.carrier,tk=gm.tkBy;
  let txt='',change=false,next=25,run=18,scored=false;
  if(kind==='inc'){txt=note;gm.down++;run=5;}
  else if(kind==='int'){txt=uo?'Intercepted!':'Interception! Your ball';if(uo)st.int++;else st.dInt++;change=true;next=z>=100?20:clamp(Math.round(100-z),1,99);run=6;zoneOut(by.QB);zoneUp(gm.intBy,1);}
  else{const td=kind==='td',zr=td?100:Math.min(99,Math.round(z)),gain=zr-los;
    if(uo){if(kind==='sack')st.sk++;else if(passed)st.yds+=gain;else st.rush+=gain;if(td&&passed)st.td++;}
    else{if(kind==='sack')st.dSk++;st.dYds+=gain;}
    if(kind==='sack'){zoneOut(by.QB);zoneUp(tk,1);}
    else{if(gm.caught){zoneUp(by.QB,3);zoneUp(c,2);}else if(c&&c.rp.pos==='RB'){if(gain>=5)zoneUp(c,2);else if(gain<0)zoneOut(c);}
      if(tk)zoneUp(tk,tk.rp.pos==='DL'?(gain<=0?1:3):2);}
    if(td||gain>=20)for(const e of gm.ents)if(e.side==='D')zoneOut(e);
    if(td){const pat=Math.random()<0.96;addScore(gm.poss,pat?7:6);txt=(uo?'Touchdown!':'Touchdown '+gm.O.name)+(pat?'':' · Extra point missed');change=true;scored=true;run=6;
      for(const e of gm.ents)if(e.side==='O'&&!e.down)e.anim='cele';}
    else if(zr<=0){addScore(other,2);txt='Safety';change=true;next=35;}
    else{gm.pos=zr;if(c)gm.bx=clamp(c.x,-3.1,3.1);
      if(gain>=gm.toGo){gm.down=1;gm.toGo=Math.min(10,100-zr);txt=(gain>=0?'+':'')+gain+' yards · First down';}
      else{gm.down++;gm.toGo-=gain;txt=kind==='sack'?'Sacked · '+gain+' yards':gain===0?'No gain':(gain>0?'+':'')+gain+' yard'+(Math.abs(gain)===1?'':'s');}
      if(kind==='oob')run=6;}}
  if(!change&&gm.down>4){change=true;next=clamp(100-gm.pos,1,99);txt+=uo?' · Turnover on downs':' · Stopped on downs';}
  gm.tkBy=null;tick(run+Math.min(8,gm.t));gm.after={change,next,scored};gm.msg=txt;flash(txt);renderPanel();}
function ydName(pos){return pos<50?'your own '+pos:pos===50?'midfield':'the '+gm.O.name+' '+(100-pos);}
function showCard(title,lines,btn,fn){gm.phase='card';gm.card={title,lines,btn,fn};renderPanel();}
function cardGo(){if(!gm||!gm.card)return;const fn=gm.card.fn;gm.card=null;fn();}
function nextQuarter(){if(!gm.exp)return false;if(gm.q===2){halftime();return true;}if(gm.q===4){endReg();return true;}gm.q++;gm.clock=QLEN;gm.exp=false;return false;}
function give(side,pos){if(side==='A'&&!gm.playDef)return oppDrive(pos);startDrive(side,pos);}
function afterPlay(){const a=gm.after||{change:false};gm.after=null;const other=uoff()?'A':'U';
  if(gm.q===5){if(a.scored)return finalCard();if(a.change){gm.them+=3;return showCard('Overtime',[gm.O.name+' kick the winning field goal.'],'See final score',finalCard);}return setHuddle();}
  if(nextQuarter())return;
  if(a.change)return give(other,a.next);
  setHuddle();}
function halftime(){gm.q=3;gm.clock=QLEN;gm.exp=false;showCard('Halftime',[gm.U.name+' '+gm.us+', '+gm.O.name+' '+gm.them,gm.O.name+' get the ball to start the second half.'],'Start second half',()=>give('A',25));}
function endReg(){if(gm.us===gm.them){gm.q=5;gm.exp=false;showCard('Overtime',['Tied at '+gm.us+'. You get the ball first. Score and you win.'],'Start overtime',()=>startDrive('U',25));}else finalCard();}
function finalCard(){const st=gm.st,lines=[gm.U.name+' '+gm.us+', '+gm.O.name+' '+gm.them,
  gm.LU.QB.n+': '+st.cmp+' of '+st.att+', '+Math.round(st.yds)+' yards, '+st.td+' TD, '+st.int+' INT','Rushing: '+Math.round(st.rush)+' yards · Sacks taken: '+st.sk];
  if(gm.playDef)lines.push('Defense: '+Math.round(st.dYds)+' yards allowed · '+st.dSk+' sacks · '+st.dInt+' interceptions');
  showCard(gm.us>gm.them?'You win':'You lose',lines,'Back to team',finishGame);}
function finishGame(){const us=gm.us,them=gm.them;gm=null;FLIP=false;hideGame();finishUserGame(us,them);render();}
function fgDist(){return Math.round(100-gm.pos+17);}
// The other team's fourth-down choice when you are playing defense.
function aiFourth(){if(gm.down!==4)return false;const d=fgDist(),O=gm.O,sp=gm.pos;
  if(d<=53){const good=Math.random()<clamp(0.95-(d-20)*0.012+(gm.LO.K.ovr-75)*0.004,0.2,0.98);tick(5);if(good)gm.them+=3;
    showCard(O.name+' field goal',[d+'-yard attempt is '+(good?'good.':'no good.')],'Continue',()=>{gm.after={change:true,next:good?25:Math.max(20,100-sp)};afterPlay();});return true;}
  if(gm.toGo<=2&&sp>=50)return false;
  const net=rint(36,50),land=sp+net,s=land>=100?20:clamp(100-land,3,60);tick(8);
  showCard(O.name+' punt',[net+'-yard punt. You start at '+ydName(s)+'.'],'Continue',()=>{gm.after={change:true,next:s};afterPlay();});return true;}
// Simulated drive, used when "play defense" is turned off.
function oppDrive(s){const O=gm.O,diff=ratings(O).off-ratings(gm.U).def,lines=[];let next=25;s=clamp(s,1,99);
  if(gm.clock<18){gm.clock=0;gm.exp=true;lines.push(O.name+' run out the clock.');}
  else{let pTD=clamp(0.27+diff*0.011+(s-25)*0.006+0.04*dk(),0.06,0.8);const pFG=clamp(0.14+(s-25)*0.004,0.08,0.3),pTO=clamp(0.13-diff*0.003,0.05,0.22);
    const plays=rint(3,11);let time=plays*rint(7,11);if(time>gm.clock+10){time=gm.clock;pTD*=0.6;}
    const x=Math.random();
    if(x<pTD){const pat=Math.random()<0.95;gm.them+=pat?7:6;lines.push(O.name+' drive '+(100-s)+' yards in '+plays+' plays. Touchdown'+(pat?'.':', but the extra point is no good.'));}
    else if(x<pTD+pFG){gm.them+=3;lines.push(O.name+' move into range and hit a '+rint(24,49)+'-yard field goal.');}
    else if(x<pTD+pFG+pTO){const y=clamp(s+rint(2,35),5,95),who=pick([...gm.LU.DL,...gm.LU.LB,...gm.LU.CB,...gm.LU.S]);next=100-y;lines.push('Turnover! '+who.n+' ('+who.pos+') takes the ball away.');}
    else{const y=clamp(s+rint(3,30),10,70),land=y+rint(36,50);next=land>=100?20:clamp(100-land,5,45);lines.push(O.name+' go '+(y-s)+' yards and punt.');}
    tick(time);}
  const endsGame=gm.exp&&gm.q===4,endsHalf=gm.exp&&gm.q===2;
  if(!endsGame&&!endsHalf)lines.push('You take over at '+ydName(next)+'.');
  showCard(O.name+' possession',lines,'Continue',()=>{if(nextQuarter())return;startDrive('U',next);});}
function punt(){if(!gm||gm.phase!=='huddle'||!uoff())return;const net=rint(36,50),land=gm.pos+net,s=land>=100?20:clamp(100-land,3,60);tick(8);
  showCard('Punt',[net+'-yard punt. '+gm.O.name+' start at their own '+s+'.'],'Continue',()=>{gm.after={change:true,next:s};afterPlay();});}
function tryFG(){if(!gm||gm.phase!=='huddle'||!uoff())return;const d=fgDist(),K=gm.LU.K;gm.phase='kick';gm.kick={dist:d,tol:clamp(0.62-(d-20)*0.011+(K.ovr-75)*0.005+(K.xf?0.1:0)-0.04*dk(),0.1,0.75),t:0,m:-1};renderPanel();}
function kickNow(){const k=gm&&gm.kick;if(!k||gm.phase!=='kick')return;const good=Math.abs(k.m)<=k.tol,sp=gm.pos;gm.kick=null;tick(5);if(good)gm.us+=3;
  showCard(good?'Field goal is good':'No good',[k.dist+'-yard attempt '+(good?'splits the uprights.':'misses.')],'Continue',()=>{gm.after={change:true,next:good?25:Math.max(20,100-sp),scored:good};afterPlay();});}
function simRest(){if(!gm||(gm.card&&gm.card.fn===finishGame))return;const f=gm.q>=5?0:((4-gm.q)*QLEN+gm.clock)/(4*QLEN),r=simGame(gm.U,gm.O);
  const sc=x=>{const v=x*f,td=Math.floor(v/7);return td*7+(v-td*7>=3.5?3:0);};gm.us+=sc(r[0]);gm.them+=sc(r[1]);
  if(gm.us===gm.them){if(Math.random()<0.5)gm.us+=3;else gm.them+=3;}gm.q=4;gm.clock=0;gm.exp=false;finalCard();}

// ----- body motion -----
function updPose(e,dt){const p=e.pose,sp=Math.hypot(e.vx,e.vz),t=gm.t;
  const T={lean:0.05,lTh:0.05,rTh:0.05,lKn:0.1,rKn:0.1,lArm:0.1,rArm:0.1,lEl:0.25,rEl:0.25,fall:0,hop:0,spread:0.12};
  const pre=gm.phase==='presnap'||gm.phase==='huddle'||gm.phase==='kick'||gm.phase==='card';
  if(sp>0.6){e.ph+=sp*dt*1.9;const a=Math.min(1,sp/6),s=Math.sin(e.ph),c=Math.cos(e.ph);
    T.lTh=s*0.95*a+0.12*a;T.rTh=-s*0.95*a+0.12*a;T.lKn=a*(0.25+1.1*Math.max(0,c));T.rKn=a*(0.25+1.1*Math.max(0,-c));
    T.lArm=-s*0.8*a;T.rArm=s*0.8*a;T.lEl=T.rEl=0.3+1.1*a;T.lean=0.1+0.2*a;}
  else if(pre){if(e.stance==='s3'){T.lean=0.95;T.lTh=T.rTh=0.8;T.lKn=T.rKn=1.35;T.rArm=1.15;T.rEl=0;T.lArm=0.5;T.lEl=1.0;}
    else if(e.stance==='s2'){T.lean=0.32;T.lTh=T.rTh=0.38;T.lKn=T.rKn=0.62;T.lArm=T.rArm=0.25;T.lEl=T.rEl=0.9;}
    else{T.lean=0.12;T.lTh=T.rTh=0.15;T.lKn=T.rKn=0.28;T.lArm=T.rArm=0.7;T.lEl=T.rEl=1.25;}}
  const an=e.anim;
  if(an==='block'){T.lean=0.28;T.lArm=T.rArm=1.5;T.lEl=T.rEl=0.25;if(sp<=0.6){T.lTh=T.rTh=0.35;T.lKn=T.rKn=0.6;}}
  else if(an==='throw'){const u=(t-e.animT)/0.36;if(u>1.4)e.anim='idle';else{const w=Math.min(1,u/0.55),f=clamp((u-0.55)/0.45,0,1);T.rArm=u<0.55?1.2+2.5*w:3.7-2.7*f;T.rEl=u<0.55?1.4:0.2;T.lArm=0.9;T.lEl=0.8;T.lean=0.1;}}
  else if(an==='catch'){T.lArm=T.rArm=2.3;T.lEl=T.rEl=0.35;}
  else if(an==='carry'){T.rArm=0.55;T.rEl=1.9;}
  else if(an==='down'){T.fall=1;T.lArm=T.rArm=2.5;T.lEl=T.rEl=0.2;T.lTh=0.15;T.rTh=0.05;T.lKn=0.3;T.rKn=0.1;T.lean=0;}
  else if(an==='dive'){T.fall=0.92;T.lArm=T.rArm=2.2;T.lEl=T.rEl=0.1;T.lean=0;T.lTh=T.rTh=0.1;T.lKn=T.rKn=0.15;}
  else if(an==='cele'){T.lArm=T.rArm=3.0;T.lEl=T.rEl=0.1;T.lean=-0.05;T.hop=Math.abs(Math.sin(performance.now()/110+e.ph))*0.4;T.spread=0.3;}
  if(an==='dive'&&!e.down&&e.stun<=t&&!e.lunge)e.anim='idle';
  const k=1-Math.exp(-dt*18),kf=1-Math.exp(-dt*9);
  for(const key in T){if(key==='fall')p.fall+=(T.fall-p.fall)*kf;else if(key==='hop')p.hop=T.hop;else p[key]+=(T[key]-p[key])*k;}
  let want=e.dir;if(e.face)want=Math.atan2(e.face.x-e.x,e.face.z-e.z);else if(sp>1)want=Math.atan2(e.vx,e.vz);
  let dd=want-e.dir;while(dd>Math.PI)dd-=2*Math.PI;while(dd<-Math.PI)dd+=2*Math.PI;e.dir+=dd*(1-Math.exp(-dt*12));}
function updCam(dt){const uo=uoff();let fx=gm.bx,fz=uo?gm.pos-5:gm.pos+5,back=uo?15.5:19;
  if(gm.phase==='live'||gm.phase==='dead'){const b=gm.ball,c=gm.ctl;
    if(b&&b.fly){fx=uo?b.x:b.land.x;fz=uo?Math.max(gm.by.QB.z,b.z-4):b.land.z;back=uo?15.5:17;}
    else if(!uo&&gm.mode==='pocket'&&gm.phase==='live'&&c){fx=c.x*0.6;fz=(c.z+gm.pos+5)/2;}
    else if(b&&b.held){fx=b.held.x;fz=b.held.z;if(!uo)back=16;}else if(gm.focus){fx=gm.focus.x;fz=gm.focus.z;}}
  const k=gm.camSnap?1:1-Math.exp(-dt*4.5);gm.camSnap=false;cam.x+=(RX(fx)*0.7-cam.x)*k;cam.z+=(RZ(fz)-back-cam.z)*k;}

// ----- frame loop, HUD, input -----
function flash(t){const el=document.getElementById('flash');el.textContent=t;el.classList.add('on');flashT=1.7;}
function fmtClock(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function updHud(){const g=gm,A=g.userHome?g.O:g.U,Hm=g.home,as=g.userHome?g.them:g.us,hs=g.userHome?g.us:g.them,uo=g.poss==='U',PT=uo?g.U:g.O,DT=uo?g.O:g.U;
  const ord=['1st','2nd','3rd','4th'][Math.min(3,g.down-1)],goal=g.pos+g.toGo>=100;
  const spot=g.pos===50?'Midfield':(g.pos<50?PT.abbr+' '+g.pos:DT.abbr+' '+(100-g.pos)),dot='<em class="poss" title="Has the ball"></em>';
  const s=`<div class="tm">${sw(A)}<b>${A.abbr}</b>${PT===A?dot:''}<i>${as}</i></div><div class="mid"><b>${g.q>=5?'OT':'Q'+g.q+' '+fmtClock(g.clock)}</b><span>${ord} &amp; ${goal?'Goal':g.toGo} · ${spot}</span></div><div class="tm"><i>${hs}</i>${PT===Hm?dot:''}<b>${Hm.abbr}</b>${sw(Hm)}</div><button class="btn ghost sm" data-a="simRest">Sim<span class="wide"> rest</span></button>`;
  if(s!==hudStr){hudStr=s;document.getElementById('bug').innerHTML=s;}}
function frame(ts){if(!gm){rafOn=false;return;}const dt=Math.min(0.05,(ts-lastTs)/1000||0.016);lastTs=ts;
  const n=Math.max(1,Math.ceil(dt/0.0167)),h=dt/n;
  for(let i=0;i<n&&gm;i++){if(gm.phase==='live')stepLive(h);else if(gm.phase==='dead')stepDead(h);if(!gm)break;for(const e of gm.ents)updPose(e,h);}
  if(!gm){rafOn=false;return;}
  if(gm.kick){const k=gm.kick;k.t+=dt;k.m=Math.sin(k.t*(2.6+k.dist*0.035)-1.57);const mk=document.getElementById('kmk');if(mk)mk.style.left=((k.m+1)*50)+'%';}
  if(flashT>0){flashT-=dt;if(flashT<=0)document.getElementById('flash').classList.remove('on');}
  updCam(dt);updHud();renderGame();requestAnimationFrame(frame);}
function fitCanvas(){if(!cv)return;const st=document.getElementById('stage');DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(2,Math.round(st.clientWidth*DPR));H=Math.max(2,Math.round(st.clientHeight*DPR));if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}}
function showGame(){document.getElementById('game').hidden=false;hudStr='';fitCanvas();if(!rafOn){rafOn=true;lastTs=performance.now();requestAnimationFrame(frame);}}
function hideGame(){document.getElementById('game').hidden=true;}
function setKeys(){const k=inp.k;inp.kx=(k.KeyD||k.ArrowRight?1:0)-(k.KeyA||k.ArrowLeft?1:0);inp.kz=(k.KeyW||k.ArrowUp?1:0)-(k.KeyS||k.ArrowDown?1:0);}
function initInput(){cv=document.getElementById('cv');ctx=cv.getContext('2d');
  if(window.ResizeObserver)new ResizeObserver(fitCanvas).observe(document.getElementById('stage'));addEventListener('resize',fitCanvas);
  addEventListener('keydown',ev=>{if(!gm)return;const c=ev.code;if(c==='Space'||c==='Tab'||c.startsWith('Arrow'))ev.preventDefault();inp.k[c]=true;setKeys();if(ev.repeat)return;
    if(c==='Space'){if(gm.phase==='presnap')snap();else if(gm.phase==='live'){if(uoff())juke();else dive();}else if(gm.phase==='kick')kickNow();else if(gm.phase==='dead')gm.deadT=9;else if(gm.phase==='card')cardGo();}
    else if(c==='KeyQ'||c==='Tab'||c==='KeyE')switchCtl();
    else if(/^(Digit|Numpad)[1-9]$/.test(c)){const n=+c.slice(-1);if(gm.phase==='huddle'){if(uoff()){if(n<=PLAYS.length)callPlay(n-1);}else if(n<=DCALLS.length)callDef(n-1);}else if(gm.phase==='live'&&uoff()){const r=gm.elig.find(e=>e.key===n);if(r)throwTo(r);}}});
  addEventListener('keyup',ev=>{inp.k[ev.code]=false;setKeys();});
  addEventListener('blur',()=>{inp.k={};setKeys();});
  const startStick=ev=>{inp.stick={id:ev.pointerId,x:ev.clientX,y:ev.clientY};inp.sx=inp.sz=0;};
  const pt=ev=>{const r=cv.getBoundingClientRect();return [(ev.clientX-r.left)*DPR,(ev.clientY-r.top)*DPR];};
  cv.addEventListener('pointerdown',ev=>{if(!gm)return;ev.preventDefault();const p=pt(ev);
    if(gm.phase==='presnap'){snap();return;}
    if(gm.phase==='dead'){gm.deadT=9;return;}
    if(gm.phase!=='live')return;
    if(uoff()&&gm.mode==='pocket'){let best=null,bd=52*DPR;for(const e of gm.elig){if(e.sx==null)continue;const d=Math.hypot(e.sx-p[0],e.sy-p[1]);if(d<bd){bd=d;best=e;}}if(best){throwTo(best);return;}}
    if(ev.pointerType==='mouse'){if(!uoff())dive();else if(gm.mode==='run')juke();return;}
    startStick(ev);});
  addEventListener('pointermove',ev=>{const s=inp.stick;if(!s||s.id!==ev.pointerId)return;inp.sx=clamp((ev.clientX-s.x)/44,-1,1);inp.sz=clamp(-(ev.clientY-s.y)/44,-1,1);});
  const up=ev=>{if(inp.stick&&inp.stick.id===ev.pointerId){inp.stick=null;inp.sx=inp.sz=0;}};
  addEventListener('pointerup',up);addEventListener('pointercancel',up);
  document.getElementById('panel').addEventListener('pointerdown',ev=>{if(!gm||gm.phase!=='live'||ev.pointerType==='mouse'||ev.target.closest('button'))return;ev.preventDefault();startStick(ev);});}

// ===== menus =====
const $=s=>document.querySelector(s);
const KEY='cityGridiron.v2';
const UI={tab:'home',rf:'ALL',sel:null,edMsg:'',setup:null,dpos:'ALL',tr:{team:-1,give:[],get:[],gk:[],tk:[],msg:'',ok:false},confirmNew:false};
const coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
function save(){if(!S||S.user<0)return;S.nid=NID;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===2&&o.teams&&o.teams.length===32&&o.user>=0){S=o;NID=S.nid||1;return true;}}}catch(e){}return false;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sw=(T,c)=>`<span class="sw${c?' '+c:''}" style="--a:${T.c1};--b:${T.c2}"></span>`;
const byId=(T,id)=>T.roster.find(p=>p.id===id);
const pkById=id=>S.picks.find(k=>k.id===id);
const posRank=p=>POS_ORDER.indexOf(p.pos)*1000-p.ovr;
const xfTag=p=>p.xf?' <span class="xf" title="X-Factor: '+XF[p.pos][0]+'">X</span>':'';
const phaseName=()=>S.phase==='regular'?'Week '+(S.week+1):S.phase==='playoffs'?roundName():S.phase==='draft'?S.draft.yr+' draft':S.phase==='preseason'?'Preseason':'Offseason';

function render(){if(!S||S.user<0){renderPick();return;}const U=S.teams[S.user];
  $('#top').innerHTML=`<div class="who">${sw(U,'lg')}<div><h1>${U.name}</h1><div class="meta">${S.season} · ${phaseName()} · ${U.w}-${U.l}</div></div></div><div class="stat">${S.tp}<small>Training points</small></div>`;
  $('#tabs').hidden=false;$('#tabs').innerHTML=[['home',S.phase==='draft'?'Draft':'Home'],['roster','Roster'],['trade','Trades'],['league','League']].map(t=>`<button data-a="tab" data-t="${t[0]}" class="${UI.tab===t[0]?'on':''}">${t[1]}</button>`).join('');
  ({home:vHome,roster:vRoster,trade:vTrade,league:vLeague})[UI.tab]();}
function renderPick(){if(!S)newLeague();
  $('#top').innerHTML='<div class="who"><div><h1>City Gridiron</h1><div class="meta">Pick a city to run</div></div></div>';$('#tabs').hidden=true;
  let h='<div class="wrap"><section class="card hero"><p class="eyebrow">New franchise</p><h2>Thirty-two cities. One trophy.</h2><p class="muted">Call the plays, throw the passes, play defense, and trade players and draft picks to build a winner.</p></section>';
  for(const c of ['A','N']){h+=`<section><h3>${CONF[c]} conference</h3><div class="pick">`;
    for(const d of DIVS)for(const T of S.teams.filter(t=>t.conf===c&&t.div===d)){const r=ratings(T);h+=`<button data-a="pick" data-id="${T.id}">${sw(T)}<span><b>${T.name}</b><small>${d} · ${r.ovr} overall</small></span></button>`;}
    h+='</div></section>';}
  $('#view').innerHTML=h+'</div>';}
function teamBlock(T,r){return `<div class="tb">${sw(T,'lg')}<div><b>${T.name}</b><span>${T.w}-${T.l}</span><div class="chips"><span class="chip">OFF ${r.off}</span><span class="chip">DEF ${r.def}</span></div></div></div>`;}

// ----- uniforms -----
function uniSvg(T,key){const u=UNI[T.abbr][key];return `<svg viewBox="0 0 44 70" aria-hidden="true"><rect x="14" y="44" width="16" height="16" fill="${u[2]}" stroke="#0006" stroke-width=".6"/><rect x="15" y="60" width="5" height="8" fill="${lum(u[0])>0.8?u[4]:u[0]}"/><rect x="24" y="60" width="5" height="8" fill="${lum(u[0])>0.8?u[4]:u[0]}"/>
  <path d="M4 18h36v10h-6v17H10V28H4z" fill="${u[0]}" stroke="#0006" stroke-width=".6"/><rect x="4" y="24" width="6" height="3" fill="${u[4]}"/><rect x="34" y="24" width="6" height="3" fill="${u[4]}"/>
  <text x="22" y="39" text-anchor="middle" font-size="13" font-weight="700" font-family="Barlow Condensed,Arial Narrow,sans-serif" fill="${u[1]}">12</text>
  <rect x="13" y="2" width="18" height="15" rx="6" fill="${u[3]}" stroke="#0006" stroke-width=".6"/><rect x="21" y="2" width="2" height="15" fill="${u[4]}"/><rect x="17" y="12" width="10" height="3.5" fill="#22262b"/></svg>`;}
function fixClash(T,key,other){const j=UNI[other.T.abbr][other.key][0];if(colDist(UNI[T.abbr][key][0],j)>=110)return key;
  let best=key,bd=-1;for(const k of ['A','H','X','R']){const d=colDist(UNI[T.abbr][k][0],j);if(d>bd){bd=d;best=k;}}return best;}
function openSetup(){const m=userMatch();if(!m)return;const home=m.h===S.user,U=S.teams[S.user],O=S.teams[home?m.a:m.h];
  const uU=home?'H':fixClash(U,'A',{T:O,key:'H'});UI.setup={home,opp:O.id,uU,uO:fixClash(O,home?'A':'H',{T:U,key:uU})};}
function uniPicker(T,cur,side){return `<div class="unicol"><h3>${T.name}</h3><div class="unirow">`+['H','A','X','R'].map(k=>`<button class="uni${cur===k?' on':''}" data-a="uni" data-s="${side}" data-k="${k}" aria-pressed="${cur===k}">${uniSvg(T,k)}<span>${UNI_NAMES[k]}</span></button>`).join('')+'</div></div>';}
function settingsRow(){return `<div class="row set"><label for="setDiff">Difficulty</label><select id="setDiff">${DIFFS.map((d,i)=>`<option value="${i}"${S.diff===i?' selected':''}>${d}</option>`).join('')}</select>
  <label for="setDef">Defense</label><select id="setDef"><option value="1"${S.playDef?' selected':''}>I play defense</option><option value="0"${S.playDef?'':' selected'}>Simulate defense</option></select></div>`;}
function setupCard(lab){const su=UI.setup,U=S.teams[S.user],O=S.teams[su.opp],rival=U.conf===O.conf&&U.div===O.div;
  const clash=colDist(UNI[U.abbr][su.uU][0],UNI[O.abbr][su.uO][0])<110;
  return `<section class="card hero"><p class="eyebrow">${lab} · ${su.home?'Home':'Away'}${rival?' · Division rivalry game':''}</p><h2>Pick the uniforms</h2>
  <div class="unis">${uniPicker(U,su.uU,'U')}${uniPicker(O,su.uO,'O')}</div>${clash?'<p class="bad">These two jerseys look alike. Pick a different one for either team.</p>':''}
  ${settingsRow()}<div class="row"><button class="btn" data-a="kickoff">Kick off</button><button class="btn ghost" data-a="setupBack">Back</button></div></section>`;}

// ----- home -----
function assetLine(T,ids,kids){return ids.map(id=>byId(T,id)).map(p=>`<b>${p.pos} ${esc(p.n)}</b>${xfTag(p)} <span class="muted">${p.ovr} overall, age ${p.age}</span>`).concat(kids.map(id=>`<b>${pickName(pkById(id))} pick</b>`)).join(', ');}
function offerCard(){const o=S.offer;if(!o||!tradesOpen())return '';const T=S.teams[o.team],U=S.teams[S.user];
  if(o.give.some(id=>!byId(U,id))||o.get.some(id=>!byId(T,id))||o.giveK.some(id=>!pkById(id)||pkById(id).own!==U.id)||o.getK.some(id=>!pkById(id)||pkById(id).own!==T.id)){S.offer=null;return '';}
  return `<section class="card"><p class="eyebrow">Trade offer from ${T.name}</p><p>They send ${assetLine(T,o.get,o.getK)}</p><p>They want ${assetLine(U,o.give,o.giveK)}</p><div class="row"><button class="btn sm" data-a="offerYes">Accept</button><button class="btn ghost sm" data-a="offerNo">Decline</button></div></section>`;}
function vHome(){if(S.phase==='draft')return vDraft();const U=S.teams[S.user],r=ratings(U);let h='<div class="wrap">';
  if(S.phase==='offseason'){const ch=S.teams[S.champ];
    h+=`<section class="card hero"><p class="eyebrow">${S.season} season complete</p><h2>${ch.id===S.user?'You won the Gridiron Bowl':ch.name+' won the Gridiron Bowl'}</h2><p class="muted">Trades are open. When you start the draft, every player ages a year first: young players improve, veterans decline, and some retire.</p><div class="row"><button class="btn" data-a="startDraft">Start the ${S.season+1} draft</button></div></section>`;}
  else if(S.phase==='preseason'){const over=U.roster.length-ROSTER_MAX;
    h+=`<section class="card hero"><p class="eyebrow">Draft complete</p><h2>Ready for ${S.season+1}</h2><p class="muted">You have ${U.roster.length} players. The limit is ${ROSTER_MAX}. Trades are open.</p>${over>0?`<p class="bad">Release ${over} player${over>1?'s':''} on the Roster tab before the season starts.</p>`:''}<div class="row"><button class="btn" data-a="newSeason"${over>0?' disabled':''}>Start ${S.season+1} season</button></div></section>`;}
  else{const m=userMatch(),lab=S.phase==='regular'?'Week '+(S.week+1)+' of '+S.schedule.length:roundName();
    if(m&&UI.setup)h+=setupCard(lab);
    else if(m){const home=m.h===S.user,opp=S.teams[home?m.a:m.h];
      h+=`<section class="card hero"><p class="eyebrow">${lab} · ${home?'Home':'Away'}</p><div class="match">${teamBlock(U,r)}<span class="vs">${home?'vs':'at'}</span>${teamBlock(opp,ratings(opp))}</div><div class="row"><button class="btn" data-a="play">Play game</button><button class="btn ghost" data-a="sim">Sim game</button></div></section>`;}
    else{const alive=S.po&&(S.po.alive.A.includes(S.user)||S.po.alive.N.includes(S.user));
      h+=`<section class="card hero"><p class="eyebrow">${lab}</p><h2>${alive?'You earned a first-round bye':'Your season is over'}</h2><div class="row"><button class="btn" data-a="sim">${alive?'Continue':'Sim this round'}</button></div></section>`;}}
  h+=offerCard();
  if(S.news.length)h+='<section class="card"><h3>News</h3><ul class="news">'+S.news.slice(0,8).map(n=>`<li>${esc(n)}</li>`).join('')+'</ul></section>';
  h+=`<section class="card"><h3>Settings</h3>${settingsRow()}<p class="muted">Rookie is forgiving. Legend makes defenders faster to react, tackles surer, and the other team's quarterback sharper.</p></section>`;
  h+=`<section class="card"><h3>How to play</h3><ul class="news"><li><b>Offense:</b> pick a play, snap with <b>Space</b> or a tap, move with <b>WASD</b> or the arrow keys (drag on a phone). Throw with a receiver's number or by tapping him. Green is open, red is covered. <b>Space</b> jukes.</li><li><b>Defense:</b> pick a call, then steer the player with the blue marker. Run into the ball carrier to tackle, press <b>Space</b> to dive at him, or press it as a pass arrives to swat it. <b>Q</b> switches to the defender nearest the ball.</li><li><b>X-Factors:</b> stars marked X get a boost once they are in the zone, shown by a gold ring.</li><li><b>Training points:</b> earned every game. Spend them on the Roster tab to raise a player's rating.</li></ul><div class="row"><button class="btn ghost sm" data-a="newFr">${UI.confirmNew?'Tap again to erase this franchise':'Start a new franchise'}</button></div></section>`;
  $('#view').innerHTML=h+'</div>';}

// ----- roster and player editor -----
function editor(U){const p=byId(U,UI.sel);if(!p){UI.sel=null;return '';}const c=upgradeCost(p);
  return `<section class="card edit"><div class="row"><h3>${esc(p.n)}</h3><span class="muted">${p.pos} · ${p.ovr} overall · potential ${p.pot} · age ${p.age} · speed ${p.spd}</span></div>
  ${p.xf?`<p><span class="xf">X</span> <b>${XF[p.pos][0]}.</b> ${XF[p.pos][1]}</p>`:`<p class="muted">Reaches X-Factor (${XF[p.pos][0]}) at ${XF_OVR} overall.</p>`}
  <div class="row"><label for="edName">Name</label><input id="edName" value="${esc(p.n)}" maxlength="22" autocomplete="off"><label for="edNum">Number</label><input id="edNum" type="number" min="0" max="99" value="${p.num}" inputmode="numeric"><button class="btn sm" data-a="edSave">Save</button></div>
  <div class="row"><button class="btn sm" data-a="edUp"${c&&S.tp>=c?'':' disabled'}>${c?'Upgrade +1 overall ('+c+' point'+(c>1?'s':'')+')':'Maxed out'}</button><button class="btn ghost sm" data-a="edRel">Release</button><button class="btn ghost sm" data-a="edClose">Close</button>${UI.edMsg?`<span class="${UI.edOk?'good':'bad'}">${esc(UI.edMsg)}</span>`:''}</div></section>`;}
function vRoster(){const U=S.teams[S.user],F={ALL:POS_ORDER,OFF:['QB','RB','WR','TE','OL'],DEF:['DL','LB','CB','S'],K:['K']};
  const list=U.roster.filter(p=>F[UI.rf].includes(p.pos)).sort((a,b)=>posRank(a)-posRank(b));
  let h='<div class="wrap">'+editor(U)+'<div class="row">'+[['ALL','Everyone'],['OFF','Offense'],['DEF','Defense'],['K','Kicker']].map(f=>`<button class="btn ghost sm${UI.rf===f[0]?' sel':''}" data-a="rf" data-f="${f[0]}">${f[1]}</button>`).join('')+`<span class="muted">${U.roster.length} of ${ROSTER_MAX} players · tap a player to edit, upgrade or release</span></div>`;
  h+='<div class="card scroll"><table class="tbl"><thead><tr><th>No.</th><th class="l">Player</th><th>Pos</th><th>Age</th><th>Ovr</th><th>Pot</th><th>Spd</th><th>Trade value</th></tr></thead><tbody>';
  for(const p of list)h+=`<tr class="pl${isStarter(U,p)?' st':''}${UI.sel===p.id?' cur':''}" data-a="sel" data-id="${p.id}" tabindex="0"><td>${p.num}</td><td class="l">${esc(p.n)}${xfTag(p)}${isStarter(U,p)?' <span class="tag">Starter</span>':''}</td><td>${p.pos}</td><td>${p.age}</td><td class="ovr">${p.ovr}</td><td>${p.pot}</td><td>${p.spd}</td><td>${tradeValue(p).toFixed(1)}</td></tr>`;
  $('#view').innerHTML=h+'</tbody></table></div></div>';}

// ----- trades -----
function trRow(p,on,act,T){return `<button class="prow${on?' on':''}" data-a="${act}" data-id="${p.id}" aria-pressed="${on}"><span class="pos">${p.pos}</span><span class="nm">${esc(p.n)}${xfTag(p)}${isStarter(T,p)?' <span class="tag">S</span>':''}</span><span class="muted">${p.age}y</span><span class="ovr">${p.ovr}</span><span class="muted">${tradeValue(p).toFixed(1)}</span></button>`;}
function pkRow(k,on,act){return `<button class="prow pk${on?' on':''}" data-a="${act}" data-id="${k.id}" aria-pressed="${on}"><span class="pos">PK</span><span class="nm">${pickName(k)}</span><span class="muted"></span><span class="ovr">R${k.rd}</span><span class="muted">${pickValue(k).toFixed(1)}</span></button>`;}
function vTrade(){const U=S.teams[S.user],tr=UI.tr;if(tr.team<0||tr.team===S.user)tr.team=S.teams.find(t=>t.id!==S.user).id;const T=S.teams[tr.team];
  tr.give=tr.give.filter(id=>byId(U,id));tr.get=tr.get.filter(id=>byId(T,id));tr.gk=tr.gk.filter(id=>pkById(id)&&pkById(id).own===U.id);tr.tk=tr.tk.filter(id=>pkById(id)&&pkById(id).own===T.id);
  const give=tr.give.map(id=>byId(U,id)),get=tr.get.map(id=>byId(T,id)),gk=tr.gk.map(pkById),tk=tr.tk.map(pkById),open=tradesOpen(),nG=give.length+gk.length,nT=get.length+tk.length;
  let h='<div class="wrap">';
  if(!open)h+='<section class="card"><p class="eyebrow">Trading is closed</p><p class="muted">'+(S.phase==='draft'?'Trades reopen when the draft ends.':'The deadline is after week '+TRADE_DEADLINE+'. Trades reopen in the offseason.')+'</p></section>';
  h+=`<div class="row"><label for="trTeam">Trade with</label><select id="trTeam">${S.teams.filter(t=>t.id!==S.user).map(t=>`<option value="${t.id}"${t.id===T.id?' selected':''}>${t.name} (${t.w}-${t.l})</option>`).join('')}</select><span class="muted">Pick up to 3 players or draft picks on each side. The last column is trade value.</span></div>`;
  const srt=(a,b)=>posRank(a)-posRank(b);
  h+=`<div class="tr-cols"><section class="card"><h3>You send <span class="muted">${nG}/3</span></h3><div class="plist">${teamPicks(U.id).map(k=>pkRow(k,tr.gk.includes(k.id),'trGk')).join('')}${U.roster.slice().sort(srt).map(p=>trRow(p,tr.give.includes(p.id),'trGive',U)).join('')}</div></section><section class="card"><h3>${T.name} send <span class="muted">${nT}/3</span></h3><div class="plist">${teamPicks(T.id).map(k=>pkRow(k,tr.tk.includes(k.id),'trTk')).join('')}${T.roster.slice().sort(srt).map(p=>trRow(p,tr.get.includes(p.id),'trGet',T)).join('')}</div></section></div>`;
  let sum='<p class="muted">Select players or picks to see what they think.</p>';
  if(nG&&nT){const ev=aiEval(T,give,get,gk,tk),ok=ev.ratio>=1.03;
    sum=`<div class="row"><span>${T.name} interest</span><div class="meter${ok?' ok':''}"><i style="width:${Math.round(clamp(ev.ratio/1.03,0.04,1)*100)}%"></i></div><b>${ok?'They would say yes':ev.ratio>0.8?'Close':'Not enough'}</b></div>`;}
  h+=`<section class="card tr-sum">${sum}<div class="row"><button class="btn" data-a="propose"${open&&nG&&nT?'':' disabled'}>Propose trade</button><button class="btn ghost sm" data-a="trClear">Clear</button>${tr.msg?`<span class="${tr.ok?'good':'bad'}">${esc(tr.msg)}</span>`:''}</div></section>`;
  const v=$('#view'),sc=[...v.querySelectorAll('.plist')].map(e=>e.scrollTop),vs=v.scrollTop;v.innerHTML=h+'</div>';
  [...v.querySelectorAll('.plist')].forEach((e,i)=>{e.scrollTop=sc[i]||0;});v.scrollTop=vs;}

// ----- draft room -----
function vDraft(){const D=S.draft,pk=curPick(),T=S.teams[pk.own],mine=pk.own===S.user,U=S.teams[S.user];
  const left=D.order.slice(D.i).map(pkById).filter(k=>k.own===S.user);
  let h=`<div class="wrap"><section class="card hero"><p class="eyebrow">${D.yr} draft · Round ${pk.rd} · Pick ${D.i+1} of ${D.order.length}</p><h2>${mine?'You are on the clock':sw(T)+' '+T.name+' are on the clock'}</h2>
  <p class="muted">${left.length?'Your picks left: '+left.map(k=>'Round '+k.rd+(k.orig!==k.own?' (from '+S.teams[k.orig].name+')':'')).join(', ')+'.':'You have no picks left in this draft.'}</p>
  <div class="row">${mine?'<button class="btn ghost" data-a="draftAuto">Pick the best fit for me</button>':`<button class="btn" data-a="draftSim">${left.length?'Sim to my next pick':'Sim the rest of the draft'}</button>`}</div></section>`;
  if(mine){const F=['ALL',...POS_ORDER],pool=D.pool.filter(p=>UI.dpos==='ALL'||p.pos===UI.dpos).slice(0,40);
    h+='<div class="row">'+F.map(f=>`<button class="btn ghost sm${UI.dpos===f?' sel':''}" data-a="dpos" data-f="${f}">${f==='ALL'?'All':f}</button>`).join('')+'</div>';
    h+='<div class="card scroll"><table class="tbl"><thead><tr><th></th><th class="l">Prospect</th><th>Pos</th><th>Ovr</th><th>Pot</th><th>Age</th><th>Spd</th><th>You have</th></tr></thead><tbody>';
    for(const p of pool){const have=U.roster.filter(x=>x.pos===p.pos);h+=`<tr><td class="l"><button class="btn sm" data-a="draftPick" data-id="${p.id}">Draft</button></td><td class="l">${esc(p.n)}</td><td>${p.pos}</td><td class="ovr">${p.ovr}</td><td>${p.pot}</td><td>${p.age}</td><td>${p.spd}</td><td>${have.length} (best ${have.reduce((m,x)=>Math.max(m,x.ovr),0)})</td></tr>`;}
    h+='</tbody></table></div>';}
  if(D.log.length)h+='<section class="card"><h3>Latest picks</h3><ul class="news">'+D.log.slice(0,10).map(l=>`<li>${l.no}. ${sw(S.teams[l.team])} ${S.teams[l.team].name}: <b>${l.pos} ${esc(l.n)}</b> <span class="muted">${l.ovr} overall</span></li>`).join('')+'</ul></section>';
  $('#view').innerHTML=h+'</div>';}

// ----- league -----
function vLeague(){let h='<div class="wrap">';
  if(S.po){h+='<section class="card"><h3>Playoffs</h3>';const line=g=>{const H=S.teams[g.h],A=S.teams[g.a];return `<li>${sw(A)} ${A.name} ${g.as==null?'':g.as} at ${sw(H)} ${H.name} ${g.hs==null?'':g.hs}</li>`;};
    if(S.po.games.length)h+=`<p class="eyebrow">${roundName()}</p><ul class="news">${S.po.games.map(line).join('')}</ul>`;
    for(const r of S.po.log.slice().reverse())h+=`<p class="eyebrow">${r.name}</p><ul class="news">${r.games.map(line).join('')}</ul>`;
    h+='</section>';}
  if(S.phase==='regular'){h+='<section class="card"><h3>Playoff picture</h3><p class="muted">Each conference sends its four division winners (seeds 1 to 4), then the three best remaining records as wild cards (seeds 5 to 7). The top seed gets a bye.</p><div class="tr-cols">';
    for(const c of ['A','N']){const s=seedsFor(c),row=(T,i,lab,cls)=>`<tr class="${T.id===S.user?'me':''} ${cls}"><td>${i}</td><td class="l">${sw(T)} ${T.name}</td><td>${T.w}-${T.l}</td><td class="l muted">${lab}</td></tr>`;
      h+=`<div class="scroll"><table class="tbl"><thead><tr><th>Seed</th><th class="l">${CONF[c]}</th><th>Rec</th><th class="l">In as</th></tr></thead><tbody>`+s.div.map((T,i)=>row(T,i+1,T.div+' winner','')).join('')+s.wc.map((T,i)=>row(T,i+5,'Wild card','')).join('')+s.hunt.map(T=>row(T,'','In the hunt','out')).join('')+'</tbody></table></div>';}
    h+='</div></section>';}
  for(const c of ['A','N']){h+=`<section class="card scroll"><h3>${CONF[c]} conference</h3><table class="tbl"><thead><tr><th class="l">Team</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>Ovr</th></tr></thead><tbody>`;
    for(const d of DIVS){h+=`<tr class="div"><td class="l" colspan="6">${d}</td></tr>`;
      for(const T of S.teams.filter(t=>t.conf===c&&t.div===d).sort(cmpTeams))h+=`<tr class="${T.id===S.user?'me':''}"><td class="l">${sw(T)} ${T.name}</td><td>${T.w}</td><td>${T.l}</td><td>${T.pf}</td><td>${T.pa}</td><td>${ratings(T).ovr}</td></tr>`;}
    h+='</tbody></table></section>';}
  h+='<section class="card"><h3>Your schedule</h3><ul class="news">';
  S.schedule.forEach((wk,i)=>{const g=wk.find(x=>x.h===S.user||x.a===S.user);if(!g)return;const home=g.h===S.user,opp=S.teams[home?g.a:g.h];
    const res=g.hs==null?'':(()=>{const us=home?g.hs:g.as,th=home?g.as:g.hs;return ` <b class="${us>th?'good':'bad'}">${us>th?'W':'L'} ${us}-${th}</b>`;})();
    h+=`<li>Week ${i+1}: ${home?'vs':'at'} ${sw(opp)} ${opp.name}${res}</li>`;});
  $('#view').innerHTML=h+'</ul></section></div>';}

// ===== in-game panel =====
function playSvg(pl){const X={WR1:-19,WR2:19,WR3:-9.5,TE:4.5,RB:1.8},Z={WR1:0,WR2:0,WR3:0,TE:0,RB:-5},y=z=>22-clamp(z,-6,22);
  let s='<svg viewBox="-27 -1 54 30" aria-hidden="true"><line x1="-27" x2="27" y1="22" y2="22" class="pl-los"/>';
  if(pl.t==='pass'){for(const k in pl.r){const sg=X[k]>=0?1:-1;let pts=X[k]+','+y(Z[k]);for(const w of pl.r[k])pts+=' '+clamp(X[k]+w[0]*sg,-26,26)+','+y(Z[k]+w[1]);
      s+=`<polyline points="${pts}" class="pl-rt"/><circle cx="${X[k]}" cy="${y(Z[k])}" r="1.5" class="pl-dot"/>`;}}
  else{s+=`<polyline points="${pl.toss?'3.6,'+y(-5)+' 12,'+y(-3)+' 17,'+y(9):'1.8,'+y(-5)+' 0.6,'+y(-1)+' 0,'+y(11)}" class="pl-rt"/><circle cx="${pl.toss?3.6:1.8}" cy="${y(-5)}" r="1.5" class="pl-dot"/>`;
    for(const x of [-2.9,-1.45,0,1.45,2.9])s+=`<rect x="${x-0.6}" y="${y(-0.7)-0.6}" width="1.2" height="1.2" class="pl-ol"/>`;}
  return s+'</svg>';}
function renderPanel(){const p=$('#panel'),g=gm;if(!g){p.innerHTML='';return;}let h='';const uo=g.poss==='U',kb=t=>coarse?'':` <span class="kbd">${t}</span>`;
  if(g.phase==='huddle'&&uo){const d=fgDist();
    h='<div class="plays">'+PLAYS.map((pl,i)=>`<button class="play" data-a="call" data-i="${i}">${playSvg(pl)}<b><span class="kbd">${i+1}</span>${pl.n}</b><small>${pl.d}</small></button>`).join('')+'</div>';
    const ex=(d<=57?`<button class="btn ghost sm" data-a="fg">Kick field goal (${d} yards)</button>`:'')+(g.down===4&&g.q!==5?'<button class="btn ghost sm" data-a="punt">Punt</button>':'');
    if(ex)h+='<div class="row sp">'+ex+'</div>';h+='<p class="muted tip">Tip: turn your phone sideways for a bigger field.</p>';}
  else if(g.phase==='huddle')h='<div class="plays dcalls">'+DCALLS.map((c,i)=>`<button class="play" data-a="dcall" data-i="${i}"><b><span class="kbd">${i+1}</span>${c.n}</b><small>${c.d}</small></button>`).join('')+'</div><p class="muted sp">'+esc(g.O.name)+' have the ball. Pick a defense.</p>';
  else if(g.phase==='presnap'&&uo)h=`<div class="row"><button class="btn" data-a="snap">Snap${kb('Space')}</button><button class="btn ghost sm" data-a="change">Change play</button><span class="muted">${g.play.t==='pass'?'Throw: '+(coarse?'tap a receiver':'press his number or click him')+'. Green is open.':'You run with the back as soon as he gets the ball.'}</span></div>`;
  else if(g.phase==='presnap')h=`<div class="row"><button class="btn" data-a="snap">Ready${kb('Space')}</button><button class="btn ghost sm" data-a="sw">Switch player${kb('Q')}</button><span class="muted">You control #${g.ctl.num} ${esc(g.ctl.rp.n)} (${g.ctl.rp.pos}), under the blue marker. Call: ${DCALLS[g.dcall].n}.</span></div>`;
  else if(g.phase==='live'&&uo)h=coarse?`<div class="pad"><span class="muted">Drag here or on the field to move.${g.play.t==='pass'?' Tap a receiver to throw.':''}</span><button class="btn" data-a="juke">Juke</button></div>`:`<div class="row"><span class="muted">Move: WASD or arrows. ${g.play.t==='pass'?'Throw: press a receiver\'s number or click him. ':''}Juke: Space.</span></div>`;
  else if(g.phase==='live')h=coarse?`<div class="pad"><span class="muted">Drag to move your defender.</span><span class="row"><button class="btn ghost" data-a="sw">Switch</button><button class="btn" data-a="dive">Tackle</button></span></div>`:`<div class="row"><span class="muted">Move: WASD or arrows. Dive tackle or swat a pass: Space. Switch to the defender nearest the ball: Q.</span></div>`;
  else if(g.phase==='dead')h=`<div class="row"><b class="res">${esc(g.msg)}</b></div>`;
  else if(g.phase==='kick')h=`<div class="row"><b class="res">${g.kick.dist}-yard field goal</b><div class="kick"><span class="zone" style="width:${Math.round(g.kick.tol*100)}%"></span><span class="mk" id="kmk"></span></div><button class="btn" data-a="kick">Kick${kb('Space')}</button></div><p class="muted">Stop the marker inside the green zone.</p>`;
  else if(g.card)h=`<div class="cardp"><h3>${esc(g.card.title)}</h3>${g.card.lines.map(l=>`<p>${esc(l)}</p>`).join('')}<div class="row"><button class="btn" data-a="cont">${g.card.btn}</button></div></div>`;
  p.className=g.phase==='live'?'live':'';p.innerHTML=h;}

// ===== actions =====
function togAsset(arr,id){const tr=UI.tr,i=arr.indexOf(id),mine=arr===tr.give||arr===tr.gk,n=mine?tr.give.length+tr.gk.length:tr.get.length+tr.tk.length;if(i>=0)arr.splice(i,1);else if(n<3)arr.push(id);tr.msg='';render();}
const ACT={
  pick(d){S.user=+d.id;UI.tab='home';S.news=['Welcome to '+S.teams[S.user].name+'. Trades are open until week '+TRADE_DEADLINE+'. You start with '+S.tp+' training points.'];save();render();},
  tab(d){UI.tab=d.t;UI.confirmNew=false;UI.tr.msg='';UI.edMsg='';render();$('#view').scrollTop=0;},
  play(){openSetup();render();$('#view').scrollTop=0;},
  setupBack(){UI.setup=null;render();},
  uni(d){if(!UI.setup)return;UI.setup[d.s==='U'?'uU':'uO']=d.k;render();},
  kickoff(){const su=UI.setup;if(!su)return;UI.setup=null;startGame(S.teams[su.opp],su.home,su.uU,su.uO);},
  sim(){UI.setup=null;completeStep(false);render();},
  startDraft(){startDraft();UI.dpos='ALL';render();$('#view').scrollTop=0;},
  draftSim(){simDraftToUser();render();$('#view').scrollTop=0;},
  draftAuto(){if(S.phase==='draft'&&curPick().own===S.user)makePick(aiPick(S.teams[S.user]));render();},
  draftPick(d){if(S.phase!=='draft'||curPick().own!==S.user)return;const p=S.draft.pool.find(x=>x.id===+d.id);if(p)makePick(p);render();$('#view').scrollTop=0;},
  dpos(d){UI.dpos=d.f;render();},
  newSeason(){if(newSeason())render();},
  rf(d){UI.rf=d.f;render();},
  sel(d){UI.sel=+d.id;UI.edMsg='';render();$('#view').scrollTop=0;},
  edClose(){UI.sel=null;UI.edMsg='';render();},
  edSave(){const p=byId(S.teams[S.user],UI.sel);if(!p)return;const e=editPlayer(p,$('#edName').value,$('#edNum').value);UI.edMsg=e||'Saved.';UI.edOk=!e;render();},
  edUp(){const p=byId(S.teams[S.user],UI.sel);if(!p)return;const e=upgradePlayer(p);UI.edMsg=e||'Upgraded to '+p.ovr+' overall.';UI.edOk=!e;render();},
  edRel(){const p=byId(S.teams[S.user],UI.sel);if(!p)return;if(UI.relId!==p.id){UI.relId=p.id;UI.edMsg='Tap Release again to let him go for good.';UI.edOk=false;render();return;}
    UI.relId=null;const e=releasePlayer(p);if(e){UI.edMsg=e;UI.edOk=false;}else{UI.sel=null;UI.edMsg='';}render();},
  trGive(d){togAsset(UI.tr.give,+d.id);},trGet(d){togAsset(UI.tr.get,+d.id);},trGk(d){togAsset(UI.tr.gk,+d.id);},trTk(d){togAsset(UI.tr.tk,+d.id);},
  trClear(){const tr=UI.tr;tr.give=[];tr.get=[];tr.gk=[];tr.tk=[];tr.msg='';render();},
  propose(){const tr=UI.tr,U=S.teams[S.user],T=S.teams[tr.team];const r=proposeTrade(T,tr.give.map(id=>byId(U,id)),tr.get.map(id=>byId(T,id)),tr.gk.map(pkById),tr.tk.map(pkById));tr.msg=r.msg;tr.ok=r.ok;if(r.ok){tr.give=[];tr.get=[];tr.gk=[];tr.tk=[];}render();},
  offerYes(){const o=S.offer,U=S.teams[S.user],T=S.teams[o.team];const r=proposeTrade(T,o.give.map(id=>byId(U,id)),o.get.map(id=>byId(T,id)),o.giveK.map(pkById),o.getK.map(pkById));S.offer=null;if(!r.ok)S.news.unshift('That offer fell through: '+r.msg);save();render();},
  offerNo(){S.offer=null;save();render();},
  newFr(){if(!UI.confirmNew){UI.confirmNew=true;render();return;}UI.confirmNew=false;try{localStorage.removeItem(KEY);}catch(e){}S=null;UI.sel=null;UI.setup=null;UI.tr={team:-1,give:[],get:[],gk:[],tk:[],msg:'',ok:false};render();},
  call(d){callPlay(+d.i);},dcall(d){callDef(+d.i);},snap(){snap();},change(){if(gm&&gm.phase==='presnap'&&gm.poss==='U')setHuddle();},juke(){juke();},dive(){dive();},sw(){switchCtl();if(gm&&gm.phase==='presnap')renderPanel();},
  cont(){cardGo();},punt(){punt();},fg(){tryFG();},kick(){kickNow();},simRest(){simRest();}};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f)f(el.dataset);});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;const el=ev.target.closest&&ev.target.closest('tr[data-a]');if(el)ACT[el.dataset.a](el.dataset);else if(ev.target.id==='edName'||ev.target.id==='edNum')ACT.edSave();});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='trTeam'){const tr=UI.tr;tr.team=+t.value;tr.get=[];tr.tk=[];tr.msg='';render();}
  else if(t.id==='setDiff'){S.diff=+t.value;save();}else if(t.id==='setDef'){S.playDef=t.value==='1';save();}});
initInput();load();render();

</script>
